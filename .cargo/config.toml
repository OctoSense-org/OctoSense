# Makepad otherwise derives the macOS menu-bar name from the checkout directory.
# Keep native Cargo launches branded correctly whatever the folder is called.
[env]
MAKEPAD_BUNDLE_NAME = { value = "OctoSense", force = true }
MAKEPAD_BUNDLE_IDENTIFIER = { value = "dev.makepad.octosense", force = true }

# AppCard embeds assets from the pinned framework checkouts (tools/setup.py).
OCTOSENSE_WORKSPACE = { value = ".sources", relative = true }

# The system apps App Hub's shell crate packs into a build (ADR 0004): which
# apps, and where their bundles are (apps/). Each packaging names its own
# selection; this default is the desktop's. phone/.cargo/config.toml selects
# the phone's, so run phone builds from phone/. Cargo passes an absolute path.
OCTOSENSE_SYSTEM_APPS = { value = "desktop/system-apps.json", relative = true }

# The locked aws-lc-sys supports its CC builder on Android arm64. Use the
# installed NDK Clang directly; no additional CMake installation is needed.
AWS_LC_SYS_CMAKE_BUILDER_aarch64_linux_android = "0"

# iOS gives the main thread a 1 MB stack, and the shell's widget tree is
# built on it through nested script_apply/script_new calls that overflowed
# it on an iPhone 16 Pro (the simulator inherits macOS's 8 MB and never
# showed it). The linker's stack_size sets the main thread's stack at exec.
[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-Wl,-stack_size,0x1000000"]
