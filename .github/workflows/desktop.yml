name: Desktop

# The desktop packaging (desktop/, package `octosense`) against the one
# workspace: default, mobile-apps and the opt-in AppCard build, the graph
# guards, and the desktop's tool and script tests.

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'native-runtime.lock.json'
      - 'runtime-patches.lock.json'
      - 'tools/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'native-runtime.lock.json'
      - 'runtime-patches.lock.json'
      - 'tools/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare the pinned framework sources
        run: python3 tools/setup.py
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - name: Compile the desktop with the shared runtime
        working-directory: desktop
        run: |
          # The octos kernel is a shell service (feature `octos-core`): the
          # default and mobile-apps builds link it, on desktop and Android.
          cargo check --locked -p octosense
          cargo check --locked -p octosense --features mobile-apps
          for features in "" "--features mobile-apps"; do
            for target in "" "--target aarch64-linux-android"; do
              cargo tree --locked -p octosense $features $target -i octosense-octos-core --depth 0 >/dev/null || { echo "::error::octosense-octos-core is missing ($features $target)"; exit 1; }
            done
          done
          # AppCard's UI (the octosense-appcard module) stays opt-in: the
          # default and mobile-apps builds must not link it, and the opt-in
          # must still build.
          for target in "" "--target aarch64-linux-android"; do
            out=$(cargo tree --locked -p octosense --features mobile-apps $target -i octosense-appcard 2>&1 || true)
            grep -q "did not match any packages" <<<"$out" || { echo "::error::octosense-appcard is linked without app-appcard ($target)"; echo "$out"; exit 1; }
          done
          cargo check --locked -p octosense -p octosense-reference -p octosense-appcard --features mobile-apps,app-appcard
          # Hosted Rinx (app-rinx, in default) is the library module only:
          # never its standalone entry or its own local kernel (Rinx ADR
          # 0007). Its assistant is the shell's app-peers service.
          for target in "" "--target aarch64-linux-android"; do
            tree=$(cargo tree --locked -p octosense $target -e features -i rinx)
            grep -q 'rinx feature "octosense-module"' <<<"$tree" || { echo "::error::rinx is not linked as a module ($target)"; exit 1; }
            if grep -qE 'rinx feature "(standalone|octos-local|octos-remote)"' <<<"$tree"; then
              echo "::error::hosted rinx pulls a standalone runtime ($target)"; exit 1
            fi
            cargo tree --locked -p octosense $target -i octosense-app-peers --depth 0 >/dev/null || { echo "::error::octosense-app-peers is missing ($target)"; exit 1; }
          done
      - name: Desktop tools and scripts
        run: |
          python3 -m unittest discover -s desktop/tools -p 'test_*.py'
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: One Makepad, App Hub, octos and Rinx in the locked graph
        run: python3 tools/setup.py --check --cargo
