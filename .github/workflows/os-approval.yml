name: OS approval

on:
  pull_request:
    paths: ['crates/oauth-service/**', 'crates/shell/src/connected_review.rs', 'Cargo.toml', 'Cargo.lock', '.github/workflows/os-approval.yml']
  push:
    branches: [main]
    paths: ['crates/oauth-service/**', 'crates/shell/src/connected_review.rs', 'Cargo.toml', 'Cargo.lock', '.github/workflows/os-approval.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-approval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Preserve runtime patch bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python tools/setup.py
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: platform-accounts-windows
      - name: Approval bindings and native adapter refusal tests
        run: cargo test --locked -p octosense-oauth-service --features host --lib
      - name: Actual Windows Hello availability without authentication
        run: cargo test --locked -p octosense-oauth-service --features host native_windows_hello_availability_without_prompt -- --ignored --nocapture
