name: Phone

# Home (phone/, package `octosense-home`): the old ROM `home` job. It runs
# when the phone, the shared crates or the apps change, not for desktop-only
# or docs changes (ADR 0001 §4).

on:
  push:
    branches: [main]
    paths:
      - 'phone/**'
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'native-runtime.lock.json'
      - 'runtime-patches.lock.json'
      - 'tools/**'
      - '.github/workflows/phone.yml'
  pull_request:
    paths:
      - 'phone/**'
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'native-runtime.lock.json'
      - 'runtime-patches.lock.json'
      - 'tools/**'
      - '.github/workflows/phone.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  home:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned sources and the reviewed runtime patch
        run: python3 tools/setup.py
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: phone
      - name: Compile Home and its bundled modules
        working-directory: phone
        run: |
          # The octos kernel is a shell service (feature `octos-core`): the
          # default and mobile-apps builds link it, on desktop and Android.
          cargo check --locked -p octosense-home
          cargo check --locked -p octosense-home --features mobile-apps
          for features in "" "--features mobile-apps"; do
            for target in "" "--target aarch64-linux-android"; do
              cargo tree --locked -p octosense-home $features $target -i octosense-octos-core --depth 0 >/dev/null || { echo "::error::octosense-octos-core is missing ($features $target)"; exit 1; }
            done
          done
          # AppCard's UI (the octosense-appcard module) stays opt-in: the
          # default and mobile-apps builds must not link it, and the opt-in
          # must still build.
          for target in "" "--target aarch64-linux-android"; do
            out=$(cargo tree --locked -p octosense-home --features mobile-apps $target -i octosense-appcard 2>&1 || true)
            grep -q "did not match any packages" <<<"$out" || { echo "::error::octosense-appcard is linked without app-appcard ($target)"; echo "$out"; exit 1; }
          done
          cargo check --locked -p octosense-home -p octosense-reference -p octosense-appcard -p octosense-news -p octosense-photos -p octosense-maps --features mobile-apps,app-appcard
          # Hosted Rinx (app-rinx, in default and mobile-apps) is the library
          # module only: never its standalone entry or its own local kernel
          # (Rinx ADR 0007). Its assistant is the shell's app-peers service.
          for features in "" "--features mobile-apps"; do
            for target in "" "--target aarch64-linux-android"; do
              tree=$(cargo tree --locked -p octosense-home $features $target -e features -i rinx)
              grep -q 'rinx feature "octosense-module"' <<<"$tree" || { echo "::error::rinx is not linked as a module ($features $target)"; exit 1; }
              if grep -qE 'rinx feature "(standalone|octos-local|octos-remote)"' <<<"$tree"; then
                echo "::error::hosted rinx pulls a standalone runtime ($features $target)"; exit 1
              fi
              cargo tree --locked -p octosense-home $features $target -i octosense-app-peers --depth 0 >/dev/null || { echo "::error::octosense-app-peers is missing ($features $target)"; exit 1; }
            done
          done
      - name: Verify the single runtime graph
        run: python3 tools/setup.py --check --cargo
      - name: Test Home, App Hub admission and runtime policy
        working-directory: phone
        run: |
          # octosense-app-hub-app is App Hub's shared shell crate, a git
          # dependency with dev-dependencies: cargo cannot test it from here;
          # OctoSense-App-Hub's CI tests it.
          cargo test --locked --features mobile-apps -p octosense-home -p octosense-app-policy -p octosense-app-hub -p octosense-news -p octosense-appcard
          # The opt-in AppCard build: its module registers into Home.
          cargo test --locked --features mobile-apps,app-appcard -p octosense-home appcard
          # Maps' isolate tests need init_cx_os(), whose macOS game-input setup
          # traps off the main thread, where libtest runs tests (RUNTIME-01).
          cargo test --locked -p octosense-maps -- --skip view::tests --skip module::tests
          cargo test --locked -p makepad-widgets splash_policy
          cargo test --locked -p makepad-script-std gate::tests
