name: Phone

# Home (phone/, package `octosense-home`): the old ROM `home` job. It runs
# when the phone, the shared crates (crates/shell included) or the apps
# change, not for desktop-only or docs changes (ADR 0001 §4). It runs the
# shell's tests (octosense-shell) for both packages.

on:
  push:
    branches: [main]
    paths:
      - 'phone/**'
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'native-apps.json'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'native-runtime.lock.json'
      - 'runtime-patches.lock.json'
      - 'tools/**'
      - '.github/workflows/phone.yml'
  pull_request:
    paths:
      - 'phone/**'
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'native-apps.json'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'native-runtime.lock.json'
      - 'runtime-patches.lock.json'
      - 'tools/**'
      - '.github/workflows/phone.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: one run per PR, a new push cancels the old run. Pushes to
# main: one group, phone-main, so only the newest main commit's run completes
# and older queued or running main runs are cancelled.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'phone-main' || format('phone-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  home:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned sources and the reviewed runtime patch
        run: python3 tools/setup.py
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: phone
          # A failed or timed-out run still saves what it compiled, so a
          # rerun starts warm instead of timing out the same way.
          cache-on-failure: true
      - name: Validate launcher icons and Apple asset catalogs
        run: |
          python3 -m unittest discover -s tools -p test_app_icons.py
          python3 desktop/packaging/make_icons.py --check
      - name: Compile Home and its bundled modules
        working-directory: phone
        run: |
          # The octos kernel is a shell service (feature `octos-core`): the
          # default and mobile-apps builds link it, on desktop and Android.
          cargo check --locked -p octosense-home
          cargo check --locked -p octosense-home --features mobile-apps
          cargo check --locked -p octosense-home -p octosense-reference -p octosense-appcard --features mobile-apps,app-appcard
          # The graph guards every shell passes (tools/check-shell-graph.sh):
          # the AI services (octosense-ai-host, the octos kernel, app-peers)
          # in the default and mobile-apps graphs, host and Android; AppCard's
          # UI opt-in only; hosted Rinx the library module only (Rinx ADR
          # 0007); one makepad, one App Hub, one octos.
          bash ../tools/check-shell-graph.sh -p octosense-home
      - name: Verify the single runtime graph
        run: python3 tools/setup.py --check --cargo
      - name: The native apps' generated places match native-apps.json
        run: python3 tools/native_apps.py --check
      # The shell's real-kernel test (crates/shell/src/host_tools/
      # real_kernel_tests.rs: kernel -> app-peers broker -> the shell's relay
      # -> News's host service -> the model's turn) needs an octos binary at
      # the revision Cargo.lock pins; built once per revision and cached.
      - name: The pinned octos revision
        id: octos
        run: echo "rev=$(python3 -c 'import importlib.util as u; s=u.spec_from_file_location("k","tools/kernel-artifact.py"); m=u.module_from_spec(s); s.loader.exec_module(m); print(m.octos_revision())')" >> "$GITHUB_OUTPUT"
      # Outside target/: rust-cache restores and prunes target/.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/octos-kernel/target/release/octos
          key: octos-kernel-${{ runner.os }}-${{ steps.octos.outputs.rev }}
      - name: Build octos (unless cached)
        timeout-minutes: 45
        run: |
          if [ ! -x "$RUNNER_TEMP/octos-kernel/target/release/octos" ]; then
            python3 tools/kernel-artifact.py --host --work "$RUNNER_TEMP/octos-kernel"
          fi
      - name: Build Home, App Hub admission and runtime policy tests
        working-directory: phone
        timeout-minutes: 60
        run: cargo test --locked --features mobile-apps -p octosense-shell -p octosense-home -p octosense-app-policy -p octosense-app-hub -p octosense-appcard -p octosense-ai-host --no-run
      - name: Test Home, App Hub admission and runtime policy
        working-directory: phone
        # This step also compiles: three more shell feature builds,
        # octosense-wasm-host's tests and makepad's own tests. Cold, it took
        # 18 min before the wasm tests joined it, and ran past 30 after.
        timeout-minutes: 60
        env:
          # Runs the shell's real-kernel relay test instead of skipping it.
          OCTOS_SHELL_TEST_KERNEL: ${{ runner.temp }}/octos-kernel/target/release/octos
          # A Splash entry's 64 ms budget is wall-clock time. With ~1,000
          # tests in one process, an entry waits on shared locks and page
          # faults, and the budget counts that against the script. These
          # tests check behaviour, not time (makepad#109).
          MAKEPAD_SPLASH_BUDGET_MS: "10000"
        run: |
          # octosense-app-hub-app is App Hub's shared shell crate, a git
          # dependency with dev-dependencies: cargo cannot test it from here;
          # OctoSense-App-Hub's CI tests it.
          cargo test --locked --features mobile-apps -p octosense-shell -p octosense-home -p octosense-app-policy -p octosense-app-hub -p octosense-appcard -p octosense-ai-host
          # The opt-in AppCard build: its module registers into the shell.
          cargo test --locked --features mobile-apps,app-appcard -p octosense-shell appcard
          # The ten ADR 0013 engines are desktop only (`craft-engines`, off in
          # Home's build), so their relay, grant and kernel-cap tests run with it.
          cargo test --locked --features mobile-apps,toolbox-peers,craft-engines -p octosense-shell host_tools
          cargo test --locked --features mobile-apps,craft-engines -p octosense-shell system_chat
          # The linked Terminal (the desktop's default): its AI tools reach
          # the live emulator behind the module's TermTabs root.
          cargo test --locked --features mobile-apps,app-terminal -p octosense-shell terminal
          # Apps' WebAssembly functions: the runtime's own tests. The `wasm`
          # service's (fresh state per call; resource, cancellation and
          # admission bounds) run with the shell's above: `mobile-apps`
          # includes `wasm-functions`.
          cargo test --locked -p octosense-wasm-host
          cargo test --locked -p makepad-widgets splash_policy
          cargo test --locked -p makepad-script-std gate::tests
      # The two-lane scenario (crates/shell/src/host_tools/scenario_tests.rs):
      # the system agent and the person with ONE app's agent at the same
      # time, against the cached octos above and a scripted model, through
      # the shell's broker, relay, approval router and question model. The
      # tests share the shell's process-wide approval, relay and question
      # state, so they run alone, one at a time. Same packages and features
      # as the test step above: its build is reused.
      - name: Two-lane scenario (real kernel, scripted model)
        working-directory: phone
        timeout-minutes: 15
        env:
          OCTOS_SCENARIO_TEST_KERNEL: ${{ runner.temp }}/octos-kernel/target/release/octos
        run: cargo test --locked --features mobile-apps -p octosense-shell -p octosense-home -p octosense-app-policy -p octosense-app-hub -p octosense-appcard -p octosense-ai-host --lib host_tools::scenario_tests -- --test-threads=1 --nocapture
