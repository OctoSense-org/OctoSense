name: Shared runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          path: workspace/OctoSense
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Octoscript-Makepad
        working-directory: workspace/OctoSense
        run: python tools/setup-native.py
      - name: Compile with the shared runtime
        working-directory: workspace/OctoSense
        run: |
          # AppCard (octos) is opt-in: the default and mobile-apps builds must
          # not link it, and the opt-in must still build.
          cargo check --locked --features mobile-apps
          for target in "" "--target aarch64-linux-android"; do
            out=$(cargo tree --locked --features mobile-apps $target -i octos-core 2>&1 || true)
            grep -q "did not match any packages" <<<"$out" || { echo "::error::octos-core is linked without app-appcard ($target)"; echo "$out"; exit 1; }
          done
          cargo check --locked --workspace --features mobile-apps,app-appcard
      - name: Reject divergent runtime sources
        working-directory: workspace/OctoSense
        run: |
          python tools/setup-native.py --check --cargo-manifest Cargo.toml
