name: Report a problem
description: Report a problem with App Hub itself, such as hub, card-host, the gate, the store or the catalog.
title: "Problem: <short summary>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for problems with App Hub itself: `hub`, `card-host`, the gate, the store or the catalog.
        To submit an app, use the **Submit an app** form instead. To ask how to build an app, use [OctoSense App Flow](https://github.com/OctoSense-org/OctoSense-App-Flow/issues) (formerly Design Flow).
        可以用中文填写。

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw. Paste error messages exactly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, in order.
      render: sh
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: App Hub revision
      description: "The full commit you built `hub` or `card-host` from: run `git rev-parse HEAD` in your App Hub checkout."
      placeholder: the full 40-character commit SHA
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows
        - Linux
        - Windows (WSL)
        - Android
        - Other
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Full output
      description: The complete output of the failing command, for example `hub check`.
      render: text

  - type: textarea
    id: more
    attributes:
      label: Anything else
