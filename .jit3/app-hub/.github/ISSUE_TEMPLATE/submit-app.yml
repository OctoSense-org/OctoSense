name: Submit an app
description: Request app admission; add release evidence when it is ready.
title: "Submit <app id> <version>"
body:
  - type: markdown
    attributes:
      value: |
        Open this issue to request publication. The release can come later; fill in what is ready and list pending checks.
        App Hub accepts only GitHub-attested releases: your app's GitHub workflow attests each release, so you need no signing key or signing secret.
        Read [the guide](https://github.com/OctoSense-org/OctoSense-App-Hub/blob/main/docs/SUBMITTING.md) ([简体中文](https://github.com/OctoSense-org/OctoSense-App-Hub/blob/main/docs/SUBMITTING.zh-CN.md)).
        Until your app is first published, post each new release here as a comment, with its tag, full commit SHA and workflow-run link, and update this issue's title and Version field to the new version. After publication, open a new issue for each new version and link the previous one.
        A maintainer reviews the exact release pack before catalog admission. A tag or release is not approval.
        Do not submit a PR editing catalog.json, catalog-v2.json, index/ or artifacts/.
  - type: dropdown
    id: release-status
    attributes:
      label: Release status
      options:
        - Request opened; release evidence pending
        - GitHub release ready for review
    validations:
      required: true
  - type: input
    id: app-id
    attributes:
      label: "App id"
      description: "The id in bundle/manifest.json."
      placeholder: "org.example.tipjar"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version"
      description: "Planned manifest version; each released update needs a higher semantic version. Before first publication, update this field and the issue title to the version of the newest release you posted."
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: "Repository URL"
      description: "Public GitHub app repository; a tag or release does not need to exist yet."
      placeholder: "https://github.com/<you>/<app>"
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: "Requested capabilities and app behavior"
      description: "Explain what the app does and why it needs each capability; mark undecided requests pending."
      placeholder: "storage: save app-owned drafts"
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: "Tag"
      description: "Add when ready: v followed by the exact manifest version. Never move a pushed tag."
      placeholder: "v0.1.0"
    validations:
      required: false
  - type: input
    id: commit
    attributes:
      label: "Full commit SHA"
      description: "Add when ready: all 40 characters from git rev-parse \"<tag>^{commit}\"."
      placeholder: "40-character source commit SHA"
    validations:
      required: false
  - type: input
    id: bundle-path
    attributes:
      label: "Bundle path"
      description: "Editable source location; the generated release pack holds the final attested manifest."
      placeholder: "bundle/"
    validations:
      required: false
  - type: input
    id: workflow-run
    attributes:
      label: "GitHub workflow run URL"
      description: "Add the successful tag-push publishing run before admission."
      placeholder: "https://github.com/<you>/<app>/actions/runs/<run>"
    validations:
      required: false
  - type: input
    id: release-pack
    attributes:
      label: "Release and pack URL"
      description: "Add the Release containing app.bundle.pack.json and release-receipt.json before admission."
      placeholder: "https://github.com/<you>/<app>/releases/tag/v0.1.0"
    validations:
      required: false
  - type: input
    id: pack-sha256
    attributes:
      label: "Release pack SHA256"
      description: "Add the downloaded pack hash and confirm it matches release-receipt.json."
      placeholder: "64 hex characters"
    validations:
      required: false
  - type: input
    id: bundle-digest
    attributes:
      label: "Bundle BLAKE3 digest"
      description: "Add integrity.bundle_blake3 from the final manifest in the verified release pack."
      placeholder: "64 hex characters"
    validations:
      required: false
  - type: input
    id: privacy-url
    attributes:
      label: "Privacy policy URL"
      description: "Before admission: publisher.privacy_policy_url from the listing, or its immutable repository file; must return HTTP 200."
      placeholder: "https://github.com/<you>/<app>/blob/<commit>/PRIVACY.md"
    validations:
      required: false
  - type: input
    id: support
    attributes:
      label: "Support contact"
      description: "Before admission: listing publisher.support, a working URL or email address."
      placeholder: "https://github.com/<you>/<app>/issues"
    validations:
      required: false
  - type: textarea
    id: platforms
    attributes:
      label: "Platforms tested"
      description: "List tested hosts and exact revisions. Pending is allowed at request time; only claim tested platforms in the final listing."
      placeholder: "macos: OctoSense desktop 0.1.0-rc.1; describe tests"
    validations:
      required: false
  - type: input
    id: hub-revision
    attributes:
      label: "App Hub revision the gate ran on"
      description: "Add the immutable Hub tool revision from the workflow and local verification before admission."
      placeholder: "40-character commit SHA"
    validations:
      required: false
  - type: textarea
    id: gate-output
    attributes:
      label: "Gate and publisher verification output"
      description: "Before admission: complete publisher-unpack/publisher-verify output for the downloaded pack, plus development gate output. A source clone alone does not verify a release pack."
      placeholder: "Pending release verification"
    validations:
      required: false
  - type: textarea
    id: scan-answers
    attributes:
      label: "Scan answers"
      description: "Before admission: answer every hub scan packet question, with the supporting bundle file. Seven questions, or eight for an app agent."
      placeholder: "Pending review packet"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots"
      description: "Before admission: real native captures linked at an immutable commit. Identify fictional data."
      placeholder: "Pending native captures"
    validations:
      required: false
  - type: textarea
    id: not-verified
    attributes:
      label: "What is not verified"
      description: "Name incomplete release steps, platforms, host services, live sign-in and writes. Update this as checks finish."
      placeholder: "Release workflow and compatible-host installation are pending."
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: My bundle and this issue contain no passwords, private keys, API keys or tokens.
          required: true
        - label: I will not move, delete or recreate a pushed release tag.
          required: true
        - label: I have identified pending checks and understand that a release is not Hub approval.
          required: true
