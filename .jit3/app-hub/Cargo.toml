# The OctoSense app hub: the crates behind the catalog in this repository.
#
#   app-contract  the app contract (OctoSense ADR 0005), published to
#                 crates.io: manifest, app policy, integrity, running a
#                 package; depends on crates.io crates only
#   app-policy    the signed manifest and listing; admission; resolution into
#                 an isolate's settings and an agent session profile (ADR 0002)
#   app-hub       the index, the signed catalog, the gate, the scan, the device
#                 client and the `hub` command (ADR 0003)
#   appstore      the store as an OctoSense module, plus the `card` host module
#                 that runs an installed app as its own client
#   appstore-app  the store as a standalone app
#   card-host     the reference contained host for one card bundle
#   app-host      a one-window host for any AppModule
#   app-hub-app   the shell integration every OctoSense shell links: the
#                 native store module, the Card runner, system apps, icons
#   card-studio   renders a card in card-host --remote at glance, phone and
#                 desktop sizes, runs the measured checks, and prepares its
#                 vision critique (ADR 0002 section 7)
[workspace]
resolver = "2"
members = [
    "crates/app-contract",
    "crates/app-policy",
    "crates/app-hub",
    "crates/appstore",
    "crates/appstore-app",
    "crates/card-host",
    "crates/app-host",
    "crates/app-hub-app",
    "crates/card-studio",
]

# The app contract (OctoSense ADR 0005): every crate here depends on it by
# version (`octosense-app-contract = "1"`), the way apps and the shell do, so
# a consumer that takes App Hub from git links the crates.io copy and only
# one copy of the contract exists in its build. App Hub itself develops
# against the local crate. A [patch] in this workspace never applies to
# consumers.
[patch.crates-io]
octosense-app-contract = { path = "crates/app-contract" }

# Builds resolve the pinned sources from the prepared sibling checkouts, as
# the OctoSense launcher workspace does.
[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-widgets = { path = "../makepad/widgets" }
makepad-app-module = { path = "../makepad/libs/app_module" }
makepad-script = { path = "../makepad/platform/script" }
makepad-ai-services = { path = "../makepad/libs/ai/services" }
makepad-strict-json = { path = "../makepad/libs/strict_json" }
makepad-studio-protocol = { path = "../makepad/platform/studio" }
makepad-network = { path = "../makepad/platform/network" }
makepad-wm-theme = { path = "../makepad/libs/wm_theme" }

[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-makepad = { path = "../octoscript-makepad/crates/octoscript-makepad" }
octoscript-widgets = { path = "../octoscript-makepad/crates/octoscript-widgets" }
octoscript-node = { path = "../octoscript-makepad/crates/octoscript-node" }

[patch."https://github.com/OctoSense-org/Octoscript.git"]
octoscript-ui-l0 = { path = "../octoscript/crates/octoscript-ui-l0" }
