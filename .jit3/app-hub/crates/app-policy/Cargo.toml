# octosense-app-policy — ADR 0002 phase 1: the app manifest, and the one
# place that turns it into the two containers an installed app runs in.
#
# The manifest, the app-facing policy, admission and running a package are
# the app contract (crates/app-contract, OctoSense ADR 0005), re-exported
# here unchanged; this crate adds the agent, the containers, listings,
# research words and the host service registry.
#
# It owns no runtime: it parses and verifies a manifest, resolves it against
# the host's own ceilings, and hands back (a) the settings for the app's
# splash isolate and (b) the profile for its octos agent session. Nothing
# else may set either, so an app can never widen its own limits.
#
# Deliberately free of makepad and octos dependencies: this is policy, it
# must be testable in milliseconds, and both consumers are thin adapters.
[package]
name = "octosense-app-policy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Signed app manifests resolved into splash-isolate settings and octos agent session profiles (ADR 0002)"

[dependencies]
# The app contract (ADR 0005): the manifest, the app-facing policy, the
# integrity checks and running a package. This crate re-exports it and adds
# what only App Hub and the shell need. By version only, never a path: a
# consumer that takes this crate from git (the OctoSense shell) must link the
# same crates.io copy as every app (Rinx), or Cargo builds two contracts. The
# workspace's [patch.crates-io] points it at crates/app-contract here.
octosense-app-contract = "1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for the splash adapter: the policy core never touches makepad, so the
# rules stay testable in milliseconds. Off by default.
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d653bc4493619ab979ccff165cf48c0c63b77d19", optional = true }

[features]
default = []
# Apply a resolved policy to a live splash isolate.
splash = ["dep:makepad-widgets"]
