# The store's standalone shape, so it can be run and tested without a shell.
[package]
name = "octosense-appstore-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The OctoSense app store as a standalone app"

[lib]
name = "octosense_appstore_app"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "appstore"
path = "src/main.rs"

[dependencies]
octosense-appstore = { path = "../appstore" }
octosense-app-host = { path = "../app-host" }
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d653bc4493619ab979ccff165cf48c0c63b77d19" }
