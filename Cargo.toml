# OctoSense: the shell, its services, the system apps and both packagings in
# one workspace (docs/adr/0001-one-octosense-repository.md).
#
#   desktop/   the desktop packaging (package `octosense`)
#   phone/     the Home app: Android, OpenHarmony and iOS packaging (package
#              `octosense-home`; the APK keeps the dev.makepad.octosense id)
#   crates/    shell (octosense-shell: window manager, hosting, phone layer —
#              both packages link it) and its services: ai-host, kernel,
#              app-peers, toolbox (workflow templates; not linked by the
#              shells yet)
#   apps/      system apps and their host services, native modules, AppCard
#
# Every external dependency is pinned ONCE, below, in [workspace.dependencies];
# members inherit it with `workspace = true`. Makepad and OctoScript resolve to
# the checkouts tools/setup.py prepares in .sources/ (the [patch] tables at
# the end), so the graph has one Makepad, one App Hub, one octos and one Rinx
# by construction; tools/setup.py --check --cargo verifies it.

[workspace]
resolver = "2"
members = [
    "desktop",
    "phone",
    "crates/kernel",
    "crates/app-peers",
    "crates/ai-host",
    "crates/shell",
    "crates/toolbox",
    "apps/reference",
    "apps/news/host-service",
    "apps/mail/host-service",
    "apps/ai-providers/config",
    "apps/ai-providers/host-service",
    "apps/appcard/module",
    "apps/appcard/app/app",
    "apps/appcard/app/crates/octos-app-store",
    "apps/appcard/app/crates/octos-app-transport",
    "apps/appcard/app/crates/octos-app-render",
]
# Separate tools with their own lockfiles, and the framework checkouts.
exclude = [
    ".sources",
    "apps/appcard/personal-data",
    "apps/appcard/tools",
    "apps/appcard/vendor",
    "apps/appcard/app/splash-native",
]
default-members = ["desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["octos-app contributors"]

[workspace.dependencies]
# --- The native apps, declared in native-apps.json (ADR 0004 §1): Rinx
# (Matrix chats, Moments, articles, mini apps; the library as a hosted
# module only, never its standalone entry or its own kernel, Rinx ADR 0007),
# Terminal, App Hub (the store and the Card runner) and the opt-in Sheets,
# Reference and AppCard. A git source shares its repository's revision with
# the pins below; tools/native_apps.py writes this block and checks that.
# BEGIN native-apps: pins (generated by tools/native_apps.py from native-apps.json; do not edit)
rinx = { git = "https://github.com/hagency-org/Rinx.git", tag = "v1.0.0", default-features = false, features = ["octosense-module"] }
octosense-reference = { path = "apps/reference" }
makepad-sheets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3", default-features = false }
makepad-terminal = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3" }
octosense-appcard = { path = "apps/appcard/module" }
octosense-app-hub-app = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub", rev = "2a3d84b32ff6a12c6955decac2e987c3161a2d32" }
# END native-apps: pins
# --- Makepad (OctoSense-org/makepad), the revision Octoscript-Makepad's
# runtime.json pins (native-runtime.lock.json); resolved to .sources/makepad.
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3" }
makepad-code-editor = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3" }
makepad-ai = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3" }
makepad-studio-protocol = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3" }
makepad-network = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3" }
makepad-wm-api = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3" }
makepad-ai-services = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3" }
makepad-strict-json = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3" }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3" }
makepad-wm-theme = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3" }
makepad-aichat = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a1c81312cfbbfe8bb11a363351dce709e402bce3", default-features = false }
# --- OctoScript (Octoscript dbd48cfb) and its Makepad runtime
# (Octoscript-Makepad 96587629, native-runtime.lock.json).
octoscript-ui-l0 = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "dbd48cfb799551c11e30970c393777d29644a605" }
# The bounded VM, capability-leased host modules and executable JSON schemas
# (the system toolbox's workflow templates, crates/toolbox).
octoscript-core = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "dbd48cfb799551c11e30970c393777d29644a605" }
octoscript-capabilities = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "dbd48cfb799551c11e30970c393777d29644a605" }
octoscript-schema = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "dbd48cfb799551c11e30970c393777d29644a605" }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "96587629159f1491e0c120bd40e4685259ca0359" }
octoscript-node = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "96587629159f1491e0c120bd40e4685259ca0359" }
# --- App Hub's host service registry the Mail and llm services register
# into; the same revision as App Hub's app crate (a native app, above).
octosense-appstore = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub", rev = "2a3d84b32ff6a12c6955decac2e987c3161a2d32" }
# The app policy (resolution, isolate settings, the Splash adapter) and the
# Hub client the Card runner resolves an app's policy with; the shell's
# glance tiles run cards under it (crates/shell/src/glance_card.rs).
octosense-app-policy = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub", rev = "2a3d84b32ff6a12c6955decac2e987c3161a2d32" }
octosense-app-hub = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub", rev = "2a3d84b32ff6a12c6955decac2e987c3161a2d32" }
# --- octos: ONE source for every octos crate (octos-org/octos main at the
# merge of octos#2645, Bing News's Chinese results with publisher links;
# after #2644, the other lane's running turn in shared history, #2637, the
# reader's interstitial and account-link checks the WebView renderer uses,
# and #2636, the parallel person context).
# Move octos-core, octos-cli and octos-research together; the Android kernel
# artifact (liboctos.so) is built from this same revision.
octos-core = { git = "https://github.com/octos-org/octos.git", rev = "fe08d8e6b3b32e672b0f956a2b692c3c8205b167" }
octos-cli = { git = "https://github.com/octos-org/octos.git", rev = "fe08d8e6b3b32e672b0f956a2b692c3c8205b167", default-features = false }
# The research engine (the metasearch, the SSRF-safe polite reader and the
# toolbox scope) for the toolbox's `octos-engine` feature. Same source and
# revision as above.
octos-research = { git = "https://github.com/octos-org/octos.git", rev = "fe08d8e6b3b32e672b0f956a2b692c3c8205b167", default-features = false }
# --- AppCard's inline renderers.
streaming-markdown-kit = { git = "https://github.com/Project-Robius-China/streaming-markdown-kit.git", branch = "main" }
makepad-diagram-kit = { git = "https://github.com/Project-Robius-China/makepad-diagram-kit.git", branch = "main" }
robius-open = { git = "https://github.com/project-robius/robius" }

# --- This repository's crates.
octosense-kernel = { path = "crates/kernel" }
octosense-app-peers = { path = "crates/app-peers" }
octosense-ai-host = { path = "crates/ai-host" }
octosense-shell = { path = "crates/shell" }
octosense-toolbox = { path = "crates/toolbox" }
octosense-llm-config = { path = "apps/ai-providers/config" }
octosense-llm-service = { path = "apps/ai-providers/host-service" }
octosense-mail-service = { path = "apps/mail/host-service" }
octosense-news-service = { path = "apps/news/host-service" }
octos-app = { path = "apps/appcard/app/app", default-features = false }
octos-app-store = { path = "apps/appcard/app/crates/octos-app-store" }
octos-app-transport = { path = "apps/appcard/app/crates/octos-app-transport" }
octos-app-render = { path = "apps/appcard/app/crates/octos-app-render" }

# --- crates.io (AppCard's crates inherit these).
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
keyring = "3"
# Matches octos and the Matrix SDK: one libsqlite3-sys when AppCard shares a
# process with them (OctoSense hosting Rinx).
rusqlite = { version = "0.40.1", features = ["bundled"] }
log = "0.4"

# Workspace-wide clippy policy for the crates that opt in (`[lints]
# workspace = true`, AppCard's): lints that are real but tracked elsewhere.
[workspace.lints.clippy]
result_large_err = "allow"
large_enum_variant = "allow"
derivable_impls = "allow"
unnecessary_get_then_check = "allow"
collapsible_match = "allow"

[profile.dev]
opt-level = 1
# Keep dev builds small: line tables are enough for backtraces, dependencies
# get no debug info, and incremental caches are disabled (they grow unbounded).
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# The provisioning QR's Argon2id and the QR/image decoders take seconds
# unoptimised; optimise just those so debug builds and tests run at speed.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.rqrr]
opt-level = 3

[profile.release]
# cargo-makepad builds Android with `-C prefer-dynamic` (libstd as a bundled
# .so): fat LTO refuses that ("cannot prefer dynamic linking when performing
# LTO"), and `panic = "abort"` breaks the cdylib link against the prebuilt
# aarch64-linux-android std, which ships the unwind runtime.
lto = false
panic = "unwind"

# One Makepad and one OctoScript: every crate the graph pulls by these URLs
# (the shells', AppCard's, App Hub's, Rinx's) resolves to the checkouts
# tools/setup.py prepares in .sources/ (with the reviewed runtime patch).
[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-script = { path = ".sources/makepad/platform/script" }
makepad-widgets = { path = ".sources/makepad/widgets" }
makepad-code-editor = { path = ".sources/makepad/code_editor" }
makepad-ai = { path = ".sources/makepad/libs/makepad_ai" }
makepad-studio-protocol = { path = ".sources/makepad/platform/studio" }
makepad-network = { path = ".sources/makepad/platform/network" }
makepad-wm-api = { path = ".sources/makepad/libs/wm_api" }
makepad-ai-services = { path = ".sources/makepad/libs/ai/services" }
makepad-strict-json = { path = ".sources/makepad/libs/strict_json" }
makepad-app-module = { path = ".sources/makepad/libs/app_module" }
makepad-wm-theme = { path = ".sources/makepad/libs/wm_theme" }
makepad-aichat = { path = ".sources/makepad/apps/aichat" }
# Rinx's article editor: the Markdown and math components.
makepad-markdown = { path = ".sources/makepad/libs/markdown" }
makepad-markdown-widgets = { path = ".sources/makepad/libs/markdown_widgets" }
# The native apps from Makepad (native-apps.json `source.local`).
# BEGIN native-apps: patch https://github.com/OctoSense-org/makepad.git (generated by tools/native_apps.py from native-apps.json; do not edit)
makepad-sheets = { path = ".sources/makepad/apps/sheets" }
makepad-terminal = { path = ".sources/makepad/apps/terminal" }
# END native-apps: patch https://github.com/OctoSense-org/makepad.git

# AppCard's inline-renderer kits name makepad-widgets by the ZhangHanDong URL.
[patch."https://github.com/ZhangHanDong/makepad.git"]
makepad-widgets = { path = ".sources/makepad/widgets" }

# Rinx names makepad by the kevinaboos URL; it resolves to the one makepad here.
[patch."https://github.com/kevinaboos/makepad"]
makepad-widgets = { path = ".sources/makepad/widgets" }
makepad-code-editor = { path = ".sources/makepad/code_editor" }

[patch."https://github.com/OctoSense-org/Octoscript.git"]
octoscript-ui-l0 = { path = ".sources/octoscript/crates/octoscript-ui-l0" }
# octos-research (metasearch) runs its engines on the bounded OctoScript
# core; it resolves to the same checkout, so the graph keeps one OctoScript.
octoscript-core = { path = ".sources/octoscript/crates/octoscript-core" }
octoscript-capabilities = { path = ".sources/octoscript/crates/octoscript-capabilities" }
octoscript-schema = { path = ".sources/octoscript/crates/octoscript-schema" }

[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-makepad = { path = ".sources/octoscript-makepad/crates/octoscript-makepad" }
octoscript-widgets = { path = ".sources/octoscript-makepad/crates/octoscript-widgets" }
octoscript-node = { path = ".sources/octoscript-makepad/crates/octoscript-node" }

# Rinx takes the app-peers contract from this repository by git. Redirect
# it to the same local workspace crates, so the host and module share one
# broker contract and one kernel.
[patch."https://github.com/OctoSense-org/OctoSense.git"]
octosense-app-peers = { path = "crates/app-peers" }
octosense-kernel = { path = "crates/kernel" }
octosense-llm-config = { path = "apps/ai-providers/config" }

# One App Hub: Rinx v1.0.0 names App Hub at an older rev (e8601b80) than the
# pin above (its mini-app catalog and system apps take app-policy and the
# hub client). A patch cannot point a source at another rev of itself, so
# every App Hub crate resolves through the www host alias of the same
# repository, at the pin. Drop this once Rinx pins the same App Hub commit.
[patch."https://github.com/OctoSense-org/OctoSense-App-Hub"]
octosense-app-hub = { git = "https://www.github.com/OctoSense-org/OctoSense-App-Hub", rev = "2a3d84b32ff6a12c6955decac2e987c3161a2d32" }
octosense-app-policy = { git = "https://www.github.com/OctoSense-org/OctoSense-App-Hub", rev = "2a3d84b32ff6a12c6955decac2e987c3161a2d32" }
octosense-appstore = { git = "https://www.github.com/OctoSense-org/OctoSense-App-Hub", rev = "2a3d84b32ff6a12c6955decac2e987c3161a2d32" }
octosense-app-hub-app = { git = "https://www.github.com/OctoSense-org/OctoSense-App-Hub", rev = "2a3d84b32ff6a12c6955decac2e987c3161a2d32" }

# Rinx's Matrix stack: the patched ruma its own workspace uses (Rinx's
# [patch] sections do not reach a consumer workspace).
[patch."https://github.com/ruma/ruma"]
ruma = { git = "https://github.com/project-robius/ruma.git", branch = "tsp" }

# OpenHarmony's ioctl ABI differs from Linux: crates.io nix 0.29 plus
# `target_env = "ohos"`, from the vendor/ tree of octos' former branch rev
# 18fcd3f1 (octos main no longer vendors it). Not an octos crate: `cargo tree
# -i octos-core` still sees one octos source.
[patch.crates-io]
nix = { git = "https://github.com/octos-org/octos.git", rev = "18fcd3f16e527d2b601d7ae244f056fb711bb6b8" }
