# wm — makepad window manager. An Omarchy-behaving tiling window manager
# built as a Makepad app.
#
# Nested mode (this crate, all desktop OSes): wm owns one OS window,
# fullscreen it and it is the desktop. Tiles host other Makepad apps as
# child processes through the Studio runview mechanism: a tiny in-process
# websocket hub accepts `--stdin-loop` clients, each tile shares a GPU
# swapchain (IOSurface / DXGI handle / DMA-BUF) with its child and forwards
# input over the studio protocol.
#
# Session mode (later, Linux only): the same layout/chrome/protocol with a
# Wayland compositor display backend instead of a Makepad window. The
# layout tree, keybindings, theming and client management are kept free of
# nested-mode assumptions for that reason.

[package]
name = "octosense"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
default-run = "octosense"

[package.metadata.packager]
product_name = "OctoSense"
identifier = "dev.makepad.octosense"

# Android builds this entry point as a shared library. Declaring it explicitly
# avoids cargo-makepad's generated wrapper duplicating our workspace section.
[lib]
path = "src/main.rs"
# The binary target runs the tests for this shared source.
test = false
bench = false
doctest = false

[[bin]]
name = "octosense"
path = "src/main.rs"

[dependencies]
# `appcard,maps`: the Octoscript-AppCard widget set (kit, text roles, weather,
# finance, matplot) and the map navigation layer the appcard module renders.
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4", features = ["appcard", "maps"] }
makepad-studio-protocol = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4" }
makepad-network = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4" }
makepad-wm-api = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4" }
# The AI services wire only: the WM relays frames between the aichat child and the apps.
makepad-ai-services = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4" }
makepad-strict-json = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4" }
# In-process hosting (aicontrol §3): the module contract, the palette applied
# into each instance's isolate, and the modules this build links.
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4" }
makepad-wm-theme = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4" }
makepad-sheets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4", default-features = false, optional = true }
makepad-photos = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4", default-features = false, optional = true }
octosense-reference = { path = "apps/reference", optional = true }
# The whole Octoscript-AppCard app hosted in a tile, in-process (Phase B of
# the AppCard port): octos-app's AppShell — routing brain, cards, kernel agent.
octosense-appcard = { path = "apps/appcard", optional = true }
# Rinx (the Matrix client with Moments and articles) as an in-process module.
# Built without its standalone window entry point.
rinx = { git = "https://github.com/upstreamlabs/Rinx", rev = "5ad2c1739e5b4776588518ab76440a5367c9968e", default-features = false, features = ["octosense-module"], optional = true }
# The assistant as a module, seated in the pane in-process: the web build's
# only chat, a desktop option. Without the engine feature: no model runtime,
# NoModel and the tool console (the child process keeps the real models).
makepad-aichat = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4", default-features = false, optional = true }
# System apps (OctoSense ROM ADR 0004): News, Photos, Maps and Mail as
# contained script apps. App Hub's shell crate brings the Card runner (the
# `card` module) and packs the bundles named by OCTOSENSE_SYSTEM_APPS
# (.cargo/config.toml -> system-apps.json) from the OctoSense-System-Apps
# checkout native-apps.lock.json pins beside this one. The App Hub store is
# not linked here; only the runner and the system apps are.
octosense-app-hub-app = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub", rev = "4605128d46fb982828d8198e0d71d62a39c7d6d6", optional = true }
# Host services the system apps call through `host.request` (services.rs in
# App Hub's appstore crate): `mail` keeps Mail's accounts and passwords.
octosense-mail-service = { path = "../OctoSense-System-Apps/apps/mail/host-service", optional = true }
# `llm` keeps the assistant's LLM providers for the AI providers app; the
# config crate names the AppCard kernel's octos home it writes.
octosense-llm-service = { path = "../OctoSense-System-Apps/apps/ai-providers/host-service", optional = true }
octosense-llm-config = { path = "../OctoSense-System-Apps/apps/ai-providers/config", optional = true }

# A phone cannot spawn the desktop catalog's Cargo binaries. Link the
# available modules into native mobile builds without requiring CLI flags.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
octosense-reference = { path = "apps/reference" }
octosense-appcard = { path = "apps/appcard" }
makepad-sheets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4", default-features = false }
makepad-photos = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4", default-features = false }

[features]
default = ["system-apps"]
# Also usable on desktop for testing the same embedded apps with --module.
mobile-apps = ["app-reference", "app-sheets", "app-photos", "app-appcard", "system-apps"]
# The system apps (system-apps.json) and the Card runner that hosts them,
# each in its own isolate under its manifest's policy, plus their host
# services. Always module-hosted: a script app has no process form.
system-apps = ["dep:octosense-app-hub-app", "dep:octosense-mail-service", "dep:octosense-llm-service", "dep:octosense-llm-config"]
app-reference = ["dep:octosense-reference"]
# Sheets linked in as a module (hosting is still Process unless switched).
app-sheets = ["dep:makepad-sheets"]
# Photos (the picture wall) linked in as a module, the same way.
app-photos = ["dep:makepad-photos"]
# The AppCard module (one L0 weather card in a tile) linked in.
app-appcard = ["dep:octosense-appcard"]
# The aichat module linked in (the pane seats it in-process where there are
# no processes, or when `aichat` is switched to module hosting).
app-aichat = ["dep:makepad-aichat"]
# Rinx linked in as a module (`--module rinx`).
app-rinx = ["dep:rinx"]

[workspace]
members = [".", "apps/reference", "apps/appcard"]
default-members = ["."]
resolver = "2"

[profile.dev]
opt-level = 1

# `octos-app` (the AppCard module's engine) links two inline-renderer kits
# that name makepad-widgets by the ZhangHanDong/makepad URL. Redirected to the
# one makepad lineage this workspace pins, so the graph has a single
# makepad-widgets (a second one would make every widget type mismatch).

[profile.release]
# cargo-makepad builds Android with `-C prefer-dynamic` (libstd as a bundled
# .so): fat LTO refuses that ("cannot prefer dynamic linking when performing
# LTO"), and `panic = "abort"` breaks the cdylib link against the prebuilt
# aarch64-linux-android std, which ships the unwind runtime. Same profile as
# Octoscript-AppCard's app/Cargo.toml documents.
lto = false
panic = "unwind"

# Resolve the exact framework sources prepared by tools/setup-native.py.

[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-script = { path = "../makepad/platform/script" }
makepad-widgets = { path = "../makepad/widgets" }
makepad-code-editor = { path = "../makepad/code_editor" }
makepad-ai = { path = "../makepad/libs/makepad_ai" }
makepad-studio-protocol = { path = "../makepad/platform/studio" }
makepad-network = { path = "../makepad/platform/network" }
makepad-wm-api = { path = "../makepad/libs/wm_api" }
makepad-ai-services = { path = "../makepad/libs/ai/services" }
makepad-strict-json = { path = "../makepad/libs/strict_json" }
makepad-app-module = { path = "../makepad/libs/app_module" }
makepad-wm-theme = { path = "../makepad/libs/wm_theme" }
makepad-sheets = { path = "../makepad/apps/sheets" }
makepad-photos = { path = "../makepad/apps/photos" }
makepad-aichat = { path = "../makepad/apps/aichat" }
# Rinx's article editor: the Markdown and math components.
makepad-markdown = { path = "../makepad/libs/markdown" }
makepad-markdown-widgets = { path = "../makepad/libs/markdown_widgets" }

[patch."https://github.com/OctoSense-org/Octoscript.git"]
octoscript-ui-l0 = { path = "../octoscript/crates/octoscript-ui-l0" }

[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-makepad = { path = "../octoscript-makepad/crates/octoscript-makepad" }
octoscript-widgets = { path = "../octoscript-makepad/crates/octoscript-widgets" }
octoscript-node = { path = "../octoscript-makepad/crates/octoscript-node" }

[patch."https://github.com/ZhangHanDong/makepad.git"]
makepad-widgets = { path = "../makepad/widgets" }

# Rinx names makepad by the kevinaboos URL; it resolves to the one makepad here.
# (Its OctoSense-org URL without `.git` is the same source as the table above.)
[patch."https://github.com/kevinaboos/makepad"]
makepad-widgets = { path = "../makepad/widgets" }
makepad-code-editor = { path = "../makepad/code_editor" }


# Rinx's Matrix patches (see Rinx's Cargo.toml).
[patch."https://github.com/ruma/ruma"]
ruma = { git = "https://github.com/project-robius/ruma.git", branch = "tsp" }

# One App Hub source. This shell links App Hub's shell crate at the pin above,
# but the Mail host service (OctoSense-System-Apps) names octosense-appstore at
# an older App Hub rev; two appstore copies would keep two host-service
# registries, and the Card runner would never see Mail's service. A patch
# cannot point a source at another rev of itself, so every App Hub crate
# resolves through the www host alias of the same repository, at this pin
# (as OctoSense ROM Home does). Drop this once OctoSense-System-Apps pins the
# same App Hub rev.
[patch."https://github.com/OctoSense-org/OctoSense-App-Hub"]
octosense-app-hub-app = { git = "https://www.github.com/OctoSense-org/OctoSense-App-Hub", rev = "4605128d46fb982828d8198e0d71d62a39c7d6d6" }
octosense-app-hub = { git = "https://www.github.com/OctoSense-org/OctoSense-App-Hub", rev = "4605128d46fb982828d8198e0d71d62a39c7d6d6" }
octosense-app-policy = { git = "https://www.github.com/OctoSense-org/OctoSense-App-Hub", rev = "4605128d46fb982828d8198e0d71d62a39c7d6d6" }
octosense-appstore = { git = "https://www.github.com/OctoSense-org/OctoSense-App-Hub", rev = "4605128d46fb982828d8198e0d71d62a39c7d6d6" }
