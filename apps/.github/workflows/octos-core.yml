name: octos kernel service

# crates/octos-core (octosense-octos-core): the shell's octos kernel. Unit
# tests, and the core against a stand-in kernel (a python3 script speaking
# NDJSON JSON-RPC). The real-kernel test needs an `octos` binary
# (OCTOS_CORE_TEST_KERNEL) and passes without one; it is run by hand.

on:
  pull_request:
    paths:
      - 'crates/octos-core/**'
      - 'apps/ai-providers/config/**'
      - '.github/workflows/octos-core.yml'
  push:
    branches: [main]
    paths:
      - 'crates/octos-core/**'
      - 'apps/ai-providers/config/**'
      - '.github/workflows/octos-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        working-directory: crates/octos-core
        run: cargo test --locked
      - name: Clippy
        working-directory: crates/octos-core
        run: cargo clippy --locked --all-targets -- -D warnings
