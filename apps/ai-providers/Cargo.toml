# AI providers: the provider-config crate and the `llm` host service, in one
# workspace so both test from here (`cargo test --workspace`). Shells and
# AppCard link the crates by path; this manifest is for working on them.
[workspace]
resolver = "2"
members = ["config", "host-service"]

# The provisioning QR's Argon2id (64 MiB, t=3) takes seconds unoptimised;
# optimise just the KDF so debug builds and tests decode at release speed.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# Likewise the image search's decoders and rqrr (tests read 12 MP photos).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.rqrr]
opt-level = 3

# Resolve Makepad and Octoscript-Makepad from checkouts beside this
# repository, as every OctoSense workspace does (App Hub's appstore crate, the
# service's one Makepad-facing dependency, names them by git). The makepad
# checkout needs the contained-app runtime (splash host requests and sheets)
# the shells build with.
[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-widgets = { path = "../../../makepad/widgets" }
makepad-app-module = { path = "../../../makepad/libs/app_module" }
makepad-script = { path = "../../../makepad/platform/script" }
makepad-ai-services = { path = "../../../makepad/libs/ai/services" }
makepad-strict-json = { path = "../../../makepad/libs/strict_json" }
makepad-studio-protocol = { path = "../../../makepad/platform/studio" }
makepad-network = { path = "../../../makepad/platform/network" }

[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-makepad = { path = "../../../octoscript-makepad/crates/octoscript-makepad" }
octoscript-widgets = { path = "../../../octoscript-makepad/crates/octoscript-widgets" }
octoscript-node = { path = "../../../octoscript-makepad/crates/octoscript-node" }

[patch."https://github.com/OctoSense-org/Octoscript.git"]
octoscript-ui-l0 = { path = "../../../octoscript/crates/octoscript-ui-l0" }
