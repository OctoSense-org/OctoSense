[package]
name        = "octosense-llm-config"
# Explicit package fields (no `workspace = true`): AppCard's workspace
# (apps/appcard/app), the `llm` host service beside it and tools/llm-qr take
# this crate as a plain path dependency. No appstore or Makepad dependency, so
# anything can link it.
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
authors     = ["octos-app contributors"]
description = "LLM provider sets for the octos profile: registry, _main.json merge, and the OCTOS1/OCTOS1E provisioning QR (no UI)"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
chrono     = "0.4"
url        = "2"
# The octos profile-QR format (octos-cli `profile_qr.rs`), re-implemented
# byte-compatibly with the same primitives octos uses.
flate2           = "1"
argon2           = "0.5"
chacha20poly1305 = "0.10"
qrcode           = { version = "0.14", default-features = false, features = ["svg"] }
# `qr::render_png` for tools; UI hosts draw `qr::render_matrix` themselves.
png              = { version = "0.17", optional = true }

[features]
default = []
png = ["dep:png"]

[dev-dependencies]
# The Android scanner decodes with rqrr: a QR this crate renders must read
# back through it byte-for-byte.
rqrr = { version = "0.10", default-features = false }
png  = "0.17"

[lints.clippy]
result_large_err = "allow"
