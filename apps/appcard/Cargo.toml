[package]
name = "octosense-appcard"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "8d6bfb6644c91c562ddc33bb2e1678b2cf438513", features = ["appcard", "maps"] }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "8d6bfb6644c91c562ddc33bb2e1678b2cf438513" }
# The whole Octoscript-AppCard app as a library: routing brain, card store and
# transport, L0 lowering, sessions, composer, kernel agent — mounted here as
# its `AppShell` widget. No default features: the app's own entry points
# (`app_main!`, the dev monitor) stay out; this module is the entry point.
octos-app = { git = "https://github.com/OctoSense-org/Octoscript-AppCard.git", rev = "5cc1f53a6d868fea260a49ac195819ddb0baf6f7", default-features = false }
# Tool arguments (`ask` takes `{"text": ...}`).
serde_json = "1.0"
