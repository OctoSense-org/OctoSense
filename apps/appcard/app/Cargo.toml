[workspace]
resolver = "2"
members = [
    "app",
    "crates/octos-app-store",
    "crates/octos-app-transport",
    "crates/octos-app-render",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["octos-app contributors"]

[workspace.dependencies]
# Internal
octos-app-store     = { path = "crates/octos-app-store" }
octos-app-transport = { path = "crates/octos-app-transport" }
octos-app-render    = { path = "crates/octos-app-render" }
# LLM provider sets (registry, _main.json merge, the provisioning QR): the
# AI providers app's crate, shared with its `llm` host service.
octosense-llm-config = { path = "../../ai-providers/config" }
# The shell's octos kernel (crates/octos-core): one per process, shared by
# AppCard and the shell's other consumers. It owns the kernel's launch.
octosense-octos-core = { path = "../../../crates/octos-core" }

# Octos: ONE source for every octos crate — git octos-org/octos at a single
# rev on main (the merge of octos-org/octos#2541, which upstreamed the AppCard
# work from branch appcard/mate70-on-main).
# The crates inherit from their own workspace, which cargo reads out of the
# checkout. Move octos-core and octos-cli together; a consumer that also
# depends on octos must use the same rev, or the graph gets two octos.
octos-core = { git = "https://github.com/octos-org/octos.git", rev = "6ad76e5c1e659bdf10ec05ae869428b48edccf7f" }
# OpenHarmony only: the core linked in-process by octosense-octos-core
# (crates/octos-core), which names the same rev; move them together.
octos-cli  = { git = "https://github.com/octos-org/octos.git", rev = "6ad76e5c1e659bdf10ec05ae869428b48edccf7f", default-features = false }

# Async / wire
tokio              = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }
tokio-tungstenite  = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util       = "0.3"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
uuid               = { version = "1", features = ["v4", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
url                = "2"
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }

# Storage / OS integration
keyring  = "3"
# Matches Octos (>= #2455) and the Matrix SDK: one libsqlite3-sys (0.38) when
# AppCard shares a process with them (OctoSense hosting Rinx).
rusqlite = { version = "0.40.1", features = ["bundled"] }
log      = "0.4"

# Framework source overrides below use the sibling release prepared by
# tools/setup-native.py from Octoscript-Makepad/runtime.json.

# OpenHarmony-safe nix 0.29 (for rustyline; OHOS's ioctl ABI differs from
# Linux): crates.io nix 0.29.0 plus `target_env = "ohos"` in
# src/sys/ioctl/linux.rs. octos main does not vendor it (octos#2541 dropped the
# vendor/ tree), so it still comes from the vendor/ directory of the former
# branch rev 18fcd3f1 (branch appcard/mate70-on-main). It is not an octos crate:
# `cargo tree -i octos-core` still sees one octos source.
[patch.crates-io]
nix = { git = "https://github.com/octos-org/octos.git", rev = "18fcd3f16e527d2b601d7ae244f056fb711bb6b8" }

[profile.release]
# Fat LTO conflicts with the `-C prefer-dynamic` rustflag cargo-makepad uses
# on Android to share libstd as a bundled .so ("cannot prefer dynamic linking
# when performing LTO"). Default (thin-local) LTO keeps Android + desktop on
# one profile; revisit with a desktop-only profile if binary size matters.
lto              = false
codegen-units    = 1
# `panic = "abort"` breaks the Android cdylib link: the prebuilt std for
# aarch64-linux-android ships the `panic_unwind` runtime, and `cargo makepad
# android build` compiles the app as a cdylib against it. Unwind matches
# makepad's own profiles; desktop behavior is unchanged apart from binary size.
panic            = "unwind"
strip            = "symbols"

# Workspace-wide clippy policy. CI runs `cargo clippy --workspace
# --all-targets -- -D warnings`; the allows below cover lints that are real
# but tracked under separate workstreams. Removing any allow here without a
# follow-up PR will fail CI by design.
#   - `result_large_err` / `large_enum_variant`: Event / LifecycleResult
#     carry full protocol payloads inline; boxing is W01 follow-up.
#   - `derivable_impls` / `unnecessary_get_then_check`: clippy-1.95 style
#     nits in legacy store code; clean-up tracked separately, not blocking.
[workspace.lints.clippy]
result_large_err = "allow"
large_enum_variant = "allow"
derivable_impls = "allow"
unnecessary_get_then_check = "allow"
collapsible_match = "allow"

# Resolve the exact framework sources prepared by tools/setup-native.py.

[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-widgets = { path = "../../../../makepad/widgets" }
makepad-code-editor = { path = "../../../../makepad/code_editor" }
makepad-ai = { path = "../../../../makepad/libs/makepad_ai" }

[patch."https://github.com/OctoSense-org/Octoscript.git"]
octoscript-ui-l0 = { path = "../../../../octoscript/crates/octoscript-ui-l0" }

[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-node = { path = "../../../../octoscript-makepad/crates/octoscript-node" }

[patch."https://github.com/ZhangHanDong/makepad.git"]
makepad-widgets = { path = "../../../../makepad/widgets" }

# The provisioning QR's Argon2id (64 MiB, t=3) takes seconds unoptimised;
# optimise just the KDF so debug builds and tests decode at release speed.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
