[package]
name = "octosense-appcard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "3fda5b6f9b48f390bd5396938a95d30ad035cd6d", features = ["appcard", "maps"] }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "3fda5b6f9b48f390bd5396938a95d30ad035cd6d" }
# The whole AppCard assistant app as a library, from the pinned
# OctoSense-System-Apps checkout (apps/appcard/app/app, native-apps.lock.json;
# OCTOSENSE_WORKSPACE points its asset embedding at ../.sources): routing
# brain, card store and transport, L0 lowering, sessions, composer, kernel agent — mounted here as
# its `AppShell` widget. No default features: the app's own entry points
# (`app_main!`, the dev monitor) stay out; this module is the entry point.
octos-app = { path = "../../../.sources/system-apps/apps/appcard/app/app", default-features = false }
# Tool arguments (`ask` takes `{"text": ...}`).
serde_json = "1.0"
