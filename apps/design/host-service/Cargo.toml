# octosense-design-service — the `design` host service (ADR 0013).
#
# designcraft's page-layout engine (an InDesign-class, clean-room Rust
# reimplementation: spreads, threaded stories, a Knuth–Plass composer,
# IDML) behind typed `design.*` methods: inspect a document, render a
# page to PNG and export PDF/IDML/EPUB/native, every call a fresh,
# stateless session. designcraft has no workspace capability like
# photocraft's, so the service resolves every path itself and keeps them
# all inside the call's area (the caller's own folder from the shell's
# resolver, else the legacy `design/` corner of the caller's host
# directory), and fences the paths written inside documents (see
# src/lib.rs).
[package]
name = "octosense-design-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
# The same App Hub rev as Mail and News: one appstore, one service registry.
octosense-appstore = { workspace = true }
# Where a call works: the caller's area and its write rules (ADR 0013).
octosense-engine-area = { workspace = true }
serde_json = { workspace = true }
# The engine, pinned to one ymote/designcraft revision (ADR 0013).
designcraft-engine = { workspace = true }
designcraft-render = { workspace = true }
# The embedded-reference fence: the engine's IDML importer (its link reads
# recorded, never made) and the usvg it draws placed SVGs with.
designcraft-idml = { workspace = true }
designcraft-images = { workspace = true }

[dev-dependencies]
# Generates and checks the skill's references (tests/skill.rs).
octosense-skill-gen = { workspace = true }
# Its tool manifest is checked with App Hub's own loader (tools.json).
octosense-app-policy = { workspace = true }
tempfile = "3"
