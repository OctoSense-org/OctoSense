[package]
name = "action-receipts"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Host-owned authorization, durable operations and verified receipts"


[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# Portable optional library; no UI, SDK or runtime is linked by default.
[workspace]
