# octosense-ai-host — the shell's AI services, one entry point.
#
# Every OctoSense shell (desktop, phone) hosts the same AI stack:
#
# - the octos kernel as a shell service (octosense-kernel, crates/kernel):
#   configured once at startup, started on first use,
#   stopped at shutdown;
# - the `llm` host service the AI providers system app (`os.ai-providers`)
#   calls, with the platform's QR import (Android camera + image picker, a
#   desktop open panel and image drops, elsewhere a pasted code);
# - apps' assistant access (Rinx ADR 0007): a scoped octos app-peers service
#   offered to each granted native module instance at creation.
#
# Before this crate both shells carried their own copy of that glue (formerly
# phone/src/llm_host.rs + app_peers_host.rs; desktop/src/apps.rs,
# app_peers_host.rs, llm_image.rs).
#
# Features:
# - `octos-core`: the kernel, the app-peers broker, and the llm service's
#   restart-after-change. Android, iOS and OpenHarmony always have it (target
#   dependencies below): `cfg(kernel)` in the source, set by build.rs.
# - `llm`: register the `llm` host service (a shell's `app-hub` feature turns
#   it on; phones always).
# - `toolbox-peers`: the system toolbox offered to app agents as host-routed
#   tools (octos#2567): the grants, and the executor the shell's host-tool
#   relay routes the `toolbox` owner's calls to. Off by default; the shell's
#   feature of the same name turns it on.
#
# The kernel is crates/kernel, the app-peers contract and broker
# crates/app-peers, the `llm` service and its config apps/ai-providers/*;
# Makepad comes from the root workspace's single pin.
[package]
name = "octosense-ai-host"
description = "The OctoSense shell's AI services: octos kernel, llm host service, app peers — one entry point"
publish = false
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
octos-core = ["dep:octosense-kernel", "octosense-app-peers/octos-core", "octosense-llm-service?/octos-core"]
llm = ["dep:octosense-llm-service"]
# The system toolbox for app agents (ADR 0002 section 6, ADR 0004 section
# 12): `toolbox_peers`, over the octos research engine and the `model`
# service's host.
toolbox-peers = [
    "octos-core",
    "llm",
    "dep:octosense-toolbox",
    "octosense-toolbox/octos-engine",
    "dep:tokio",
]

[dependencies]
makepad-widgets = { workspace = true }
makepad-app-module = { workspace = true }
# The kernel's home rule without a kernel (and the profile path).
octosense-llm-config = { workspace = true }
# The contract (OCTOS_SERVICES, injection) always; the broker with `octos-core`.
octosense-app-peers = { workspace = true }
# The Card runner's host-service API: the `octos` service for contained apps.
octosense-appstore = { workspace = true }
serde_json = { workspace = true }
octosense-kernel = { workspace = true, optional = true }
octosense-llm-service = { workspace = true, optional = true }
octosense-toolbox = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "macros"] }

# Native mobile builds always carry the kernel (Android bundles liboctos.so,
# OpenHarmony links the core in-process, iOS runs none) and, when the `llm`
# service is linked, its restart-after-change.
[target.'cfg(any(target_os = "android", target_os = "ios", target_env = "ohos"))'.dependencies]
octosense-kernel = { workspace = true }
octosense-app-peers = { workspace = true, features = ["octos-core"] }
octosense-llm-service = { workspace = true, optional = true, features = ["octos-core"] }
