# octosense-octos-core — the shell's octos kernel (one per process).
#
# The shell owns the octos agent kernel as a service: this crate resolves the
# kernel's core dir (where the AI providers app's `llm` service writes
# `profiles/_main.json`), starts ONE kernel lazily on the first `connect()`
# (`octos serve --stdio` as a child on desktop and Android, the canonical core
# in-process on OpenHarmony), multiplexes it between consumers (AppCard, and
# later Rinx), restarts it when the providers change and stops it when the
# last consumer leaves. See README.md.
#
# Explicit package fields (no `workspace = true`): the shells and AppCard's
# workspace take this crate as a plain path dependency. The empty
# `[workspace]` below lets it test on its own from this directory.
[package]
name        = "octosense-octos-core"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
authors     = ["octos-app contributors"]
description = "The OctoSense shell's octos kernel: one per process, shared by every consumer over UI Protocol frames"
publish     = false


[dependencies]
tokio      = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "process", "time", "macros"] }
serde_json = "1"
log        = "0.4"
# `default_core_dir()` — the one definition of where the kernel's profile
# lives, shared with the `llm` host service that writes it.
octosense-llm-config = { workspace = true }

# OpenHarmony denies exec from HAP native libraries: the canonical core is
# linked into the app and served over an in-memory pipe. Same single octos
# source and rev as AppCard (apps/appcard/app/Cargo.toml); move them together.
# A consumer workspace must also carry the `nix` patch AppCard documents.
[target.'cfg(target_env = "ohos")'.dependencies]
octos-cli = { workspace = true, features = ["api", "git", "ast"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.clippy]
result_large_err = "allow"

# The provisioning QR's Argon2id (in the config crate) takes seconds
# unoptimised; the integration test writes profiles, not QRs, but keep the
# KDF fast like the sibling workspaces do.
