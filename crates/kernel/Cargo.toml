# octosense-kernel — the shell's octos kernel (one per process).
#
# The shell starts ONE kernel lazily (`octos serve --stdio` as a child on
# desktop and Android, the canonical core in-process on OpenHarmony) and
# shares it between consumers over UI Protocol frames. When the person turns
# on Talk to Octos, the child runs as `octos serve --host-managed` instead and
# external clients attach to the same kernel. See README.md.
[package]
name        = "octosense-kernel"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
authors     = ["octos-app contributors"]
description = "The OctoSense shell's octos kernel: one per process, shared by every consumer over UI Protocol frames"
publish     = false


[dependencies]
tokio      = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "process", "time", "macros"] }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
uuid = { workspace = true }
url = "2"
serde_json = "1"
log        = "0.4"
# `default_core_dir()` — the one definition of where the kernel's profile
# lives, shared with the `llm` host service that writes it.
octosense-llm-config = { workspace = true }
# `UI_PROTOCOL_STDIO_DEFAULT_FEATURES`: the feature set native consumers keep
# when Talk to Octos moves them from the stdio pipe to the WebSocket.
octos-core = { workspace = true }

# OpenHarmony denies exec from HAP native libraries: the canonical core is
# linked into the app and served over an in-memory pipe. Same single octos
# source and rev as AppCard (apps/appcard/app/Cargo.toml); move them together.
# A consumer workspace must also carry the `nix` patch AppCard documents.
[target.'cfg(target_env = "ohos")'.dependencies]
octos-cli = { workspace = true, features = ["api", "git", "ast"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# A desktop checks its packaged `octos-kernel` against the receipt's SHA-256
# before running it (`launch::verify_packaged`).
[target.'cfg(not(any(target_env = "ohos", target_os = "ios", target_os = "android")))'.dependencies]
sha2 = "0.10"

# Passing the kept Talk to Octos listener to the kernel (`dup2` between fork
# and exec).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.clippy]
result_large_err = "allow"

# The provisioning QR's Argon2id (in the config crate) takes seconds
# unoptimised; the integration test writes profiles, not QRs, but keep the
# KDF fast like the sibling workspaces do.
