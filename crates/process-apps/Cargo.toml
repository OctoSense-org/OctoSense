# The native apps a desktop runs as their own process, as the launch builds
# them (crates/shell/src/clients.rs, `launch_plan`): `cargo build --release
# --locked -p octosense-process-apps -p <crate> --bin <bin>`. Selecting this
# package with the app's crate gives the build the features the app's binary
# needs (`bin_features` in native-apps.json) and ties it to the workspace's
# Cargo.lock; its own library is empty and is never built by a launch
# (`--bin` selects only the app's binary). ADR 0004 §2.
[package]
name = "octosense-process-apps"
version = "0.1.0"
edition.workspace = true
publish = false
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# BEGIN native-apps: process deps (generated by tools/native_apps.py from native-apps.json; do not edit)
octosense-reference = { workspace = true }
makepad-sheets = { workspace = true, features = ["standalone"] }
makepad-terminal = { workspace = true }
makepad-calculator = { workspace = true, features = ["standalone"] }
makepad-clock = { workspace = true, features = ["standalone"] }
makepad-notes = { workspace = true, features = ["standalone"] }
makepad-reminders = { workspace = true, features = ["standalone"] }
makepad-weather = { workspace = true, features = ["standalone"] }
# END native-apps: process deps
