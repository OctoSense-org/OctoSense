# octosense-shell: the one OctoSense shell — window manager (desk, styles,
# tiling, scene), hosting (processes, in-process modules, App Hub, the AI
# pane) and the phone layer (home pages, shade, gestures, Android launcher
# bridge) — linked by both packages:
#
#   desktop/  package `octosense` (macOS, Windows, Linux, web; its Android
#             build too): `octosense_main!()` over the shell's own `App`
#   phone/    package `octosense-home` (Android, iOS, OpenHarmony): the
#             Settings app, in its own `App` wrapping the shell's
#
# The packages forward their features here (same names). The AI services
# (kernel, `llm`, app peers) are crates/ai-host's.
[package]
name = "octosense-shell"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[[example]]
name = "icon_shapes"
required-features = ["mobile-apps"]

[[example]]
name = "connected-app-host"
required-features = ["app-hub"]

[[example]]
name = "host-api-lab"
required-features = ["acceptance-fixtures"]

[[example]]
name = "app-tool-acceptance"
required-features = ["acceptance-fixtures"]

[[example]]
name = "connected-install"
required-features = ["app-hub"]

[[example]]
name = "connected-inbox-e2e"
required-features = ["mobile-apps", "acceptance-fixtures"]

[dependencies]
# The status clock is formatted in-process (localtime_r + strftime), not by forking `date`.
libc = "0.2"
# App storage (ADR 0004 §11): the account hash that names account folders;
# the approvals audit's digest of each call's arguments.
sha2 = "0.10"
# The hub's per-launch connect secrets (hub.rs): v4 UUIDs from the OS CSPRNG.
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `appcard,maps`: the AppCard widget set (kit, text roles, weather,
# finance, matplot) and the map navigation layer the appcard module renders.
makepad-widgets = { workspace = true, features = ["appcard", "maps"] }
makepad-studio-protocol = { workspace = true }
makepad-network = { workspace = true }
makepad-wm-api = { workspace = true }
# The AI services wire only: the WM relays frames between the aichat child and the apps.
makepad-ai-services = { workspace = true }
makepad-strict-json = { workspace = true }
# In-process hosting: the module contract and the palette applied into each
# instance's isolate.
makepad-app-module = { workspace = true }
makepad-wm-theme = { workspace = true }
octoscript-makepad = { workspace = true }
# The L0 checker the glance service admits published cards with (glance.rs).
octoscript-ui-l0 = { workspace = true }
# A glance card's in-card chat with its app's agent (`sys.chat`, glance_chat.rs).
octosense-l0-chat = { workspace = true }
octosense-ai-host = { workspace = true }
octosense-mail-service = { workspace = true, optional = true }
octosense-oauth-service = { workspace = true, optional = true, features = ["host"] }
octosense-markdown-editor = { workspace = true, optional = true }
# Apps' own WebAssembly functions (the `wasm` service, ADR 0011).
octosense-wasm-host = { workspace = true, optional = true }
octosense-calendar-service = { workspace = true, optional = true }
octosense-news-service = { workspace = true, optional = true }
# The sheet engine service (ADR 0013): gridcraft behind `sheet.*`, desktop only.
octosense-sheets-service = { workspace = true, optional = true }
octosense-photo-service = { workspace = true, optional = true }
octosense-word-service = { workspace = true, optional = true }
octosense-deck-service = { workspace = true, optional = true }
octosense-cad-service = { workspace = true, optional = true }
octosense-light-service = { workspace = true, optional = true }
octosense-sound-service = { workspace = true, optional = true }
octosense-design-service = { workspace = true, optional = true }
octosense-film-service = { workspace = true, optional = true }
octosense-effect-service = { workspace = true, optional = true }
# App Hub's host-service registry: the `glance` service registers into it.
octosense-appstore = { workspace = true, optional = true }
# The Card runner's policy resolution and Splash adapter: glance tiles run
# a card under its app's policy (glance_card.rs).
octosense-app-policy = { workspace = true, optional = true }
octosense-app-hub = { workspace = true, optional = true }
# The app contract (OctoSense ADR 0005): the manifest, policy limits and
# digests the shell reads itself, by version, the one copy App Hub and Rinx
# link too.
octosense-app-contract = { workspace = true, optional = true }
makepad-aichat = { workspace = true, optional = true }
# The native apps this shell can link (native-apps.json), each behind its
# `app-<id>` feature. Rinx gets the assistant only through the injected
# service: no kernel, no credentials, no AppCard. App Hub's build packs the
# system apps OCTOSENSE_SYSTEM_APPS names.
# BEGIN native-apps: deps (generated by tools/native_apps.py from native-apps.json; do not edit)
rinx = { workspace = true, features = ["octosense-module"], optional = true }
octosense-reference = { workspace = true, optional = true }
makepad-sheets = { workspace = true, optional = true }
makepad-terminal = { workspace = true, optional = true }
octosense-appcard = { workspace = true, optional = true }
octosense-app-hub-app = { workspace = true, optional = true }
makepad-calculator = { workspace = true, optional = true }
makepad-clock = { workspace = true, optional = true }
makepad-notes = { workspace = true, optional = true }
makepad-reminders = { workspace = true, optional = true }
makepad-weather = { workspace = true, optional = true }
octoscode-module = { workspace = true, features = ["octosense-module"], optional = true }
# END native-apps: deps

# The host secrets API keeps apps' secrets in the keychain (app_storage/secrets.rs).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

# A phone cannot spawn the desktop catalog's Cargo binaries: native mobile
# builds link these without flags.
[target.'cfg(any(target_os = "android", target_os = "ios", target_env = "ohos"))'.dependencies]
# BEGIN native-apps: mobile deps (generated by tools/native_apps.py from native-apps.json; do not edit)
octosense-reference = { workspace = true }
makepad-sheets = { workspace = true }
octosense-app-hub-app = { workspace = true }
# END native-apps: mobile deps
octosense-appstore = { workspace = true }
octosense-app-policy = { workspace = true }
octosense-app-hub = { workspace = true }
octosense-app-contract = { workspace = true }
octosense-mail-service = { workspace = true }
octosense-oauth-service = { workspace = true, features = ["host"] }
octosense-markdown-editor = { workspace = true }
octosense-news-service = { workspace = true }
octosense-calendar-service = { workspace = true }
octosense-ai-host = { workspace = true, features = ["llm"] }

[features]
default = []
acceptance-fixtures = ["app-hub", "octosense-oauth-service/acceptance-fixtures"]
# The standalone phone shell (cfg `mobile_only`, build.rs; Android and
# OpenHarmony get it without the flag).
mobile-only = []
# The octos kernel as a shell service (octosense-kernel, via octosense-ai-host).
octos-core = ["octosense-ai-host/octos-core"]
# One `app-<id>` per native app (native-apps.json), and `mobile-apps`: the
# apps phone builds link, usable on a desktop too. Rinx's and AppCard's
# assistant is the shell's (they imply `octos-core`); App Hub brings the host
# services its system apps call. AppCard is opt-in only, on every target.
# BEGIN native-apps: features (generated by tools/native_apps.py from native-apps.json; do not edit)
mobile-apps = ["app-rinx", "app-reference", "app-sheets", "app-hub", "app-calculator", "app-clock", "app-notes", "app-reminders", "app-weather", "app-octoscode", "octos-core"]
app-rinx = ["dep:rinx", "octos-core"]
app-reference = ["dep:octosense-reference"]
app-sheets = ["dep:makepad-sheets"]
app-terminal = ["dep:makepad-terminal"]
app-appcard = ["dep:octosense-appcard", "octos-core"]
app-hub = ["dep:octosense-app-hub-app", "dep:octosense-appstore", "dep:octosense-app-policy", "dep:octosense-app-hub", "dep:octosense-app-contract", "dep:octosense-mail-service", "dep:octosense-oauth-service", "dep:octosense-markdown-editor", "dep:octosense-news-service", "dep:octosense-sheets-service", "dep:octosense-photo-service", "dep:octosense-calendar-service", "octosense-ai-host/llm", "dep:octosense-word-service", "dep:octosense-deck-service", "dep:octosense-cad-service", "dep:octosense-light-service", "dep:octosense-sound-service", "dep:octosense-design-service", "dep:octosense-film-service", "dep:octosense-effect-service"]
app-calculator = ["dep:makepad-calculator"]
app-clock = ["dep:makepad-clock"]
app-notes = ["dep:makepad-notes"]
app-reminders = ["dep:makepad-reminders"]
app-weather = ["dep:makepad-weather"]
app-octoscode = ["dep:octoscode-module", "octos-core"]
# END native-apps: features
# The aichat module, seated in the pane in-process.
app-aichat = ["dep:makepad-aichat"]
# A development build for developer mode (ADR 0004 §13, src/dev_mode.rs):
# Settings and OCTOSENSE_DEV_MODE may turn it on. Debug builds are
# development builds without it (build.rs); a release build without it
# honours only the `--dev-grant-all` launch flag.
dev-mode = []
# The `wasm` host service (ADR 0011), which runs an app's own
# WebAssembly functions (crates/wasm-host). Off by default.
wasm-lab = ["app-hub", "dep:octosense-wasm-host"]
# The system toolbox offered to app agents as host-routed tools (ADR 0002
# §6, ADR 0004 §12; src/host_tools/toolbox.rs): the `toolbox` owner in the
# host-tool relay. Off by default.
toolbox-peers = ["octosense-ai-host/toolbox-peers"]

[dev-dependencies]
wat = "1"
# The two-lane scenario's external client (src/host_tools/scenario_tests.rs):
# a Talk to Octos connection over the kernel's WebSocket, as a browser makes.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
