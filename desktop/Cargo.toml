# OctoSense for the desktop: the shell (crates/shell, octosense-shell) in its
# own window — an Omarchy-behaving tiling window manager built as a Makepad
# app. This package is the entry point and the desktop packaging (catalog,
# upstream provenance, scripts); every feature is the shell's, forwarded.
#
# Nested mode (this crate, all desktop OSes): wm owns one OS window,
# fullscreen it and it is the desktop. Tiles host other Makepad apps as
# child processes through the Studio runview mechanism: a tiny in-process
# websocket hub accepts `--stdin-loop` clients, each tile shares a GPU
# swapchain (IOSurface / DXGI handle / DMA-BUF) with its child and forwards
# input over the studio protocol.
#
# Session mode (later, Linux only): the same layout/chrome/protocol with a
# Wayland compositor display backend instead of a Makepad window. The
# layout tree, keybindings, theming and client management are kept free of
# nested-mode assumptions for that reason.

[package]
name = "octosense"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
default-run = "octosense"

[package.metadata.packager]
product_name = "OctoSense"
identifier = "dev.makepad.octosense"

# Android builds this entry point as a shared library. Declaring it explicitly
# avoids cargo-makepad's generated wrapper duplicating our workspace section.
[lib]
path = "src/main.rs"
# The binary target runs the tests for this shared source.
test = false
bench = false
doctest = false

[[bin]]
name = "octosense"
path = "src/main.rs"

[dependencies]
# jit3: pure-Rust blake3 (no C), so --allow-c builds no native library that calls back into JIT'd Rust
# (blake3_neon references blake3_compress_in_place_portable, which dlopen cannot resolve).
blake3 = { version = "1.8", features = ["pure"] }
octosense-shell = { workspace = true }

[features]
# The default and the native apps' features are native-apps.json's (App Hub:
# the store, the Card runner and the system apps it runs; Rinx; Terminal, a
# process on macOS and Windows), with the octos kernel, a shell service in
# every standard build. `mobile-apps` is the set phone builds link, also
# usable on the desktop; AppCard is not among them (`--features app-appcard`).
# BEGIN native-apps: features (generated by tools/native_apps.py from native-apps.json; do not edit)
default = ["octos-core", "wasm-functions", "craft-engines", "app-updater", "app-terminal", "app-hub", "app-calculator", "app-clock", "app-notes", "app-reminders", "app-weather"]
mobile-apps = ["octosense-shell/mobile-apps"]
app-updater = ["octosense-shell/app-updater"]
app-reference = ["octosense-shell/app-reference"]
app-sheets = ["octosense-shell/app-sheets"]
app-terminal = ["octosense-shell/app-terminal"]
app-hub = ["octosense-shell/app-hub"]
app-calculator = ["octosense-shell/app-calculator"]
app-clock = ["octosense-shell/app-clock"]
app-notes = ["octosense-shell/app-notes"]
app-reminders = ["octosense-shell/app-reminders"]
app-weather = ["octosense-shell/app-weather"]
# END native-apps: features
# The phone shell alone, on the desktop (Android sets it itself).
mobile-only = ["octosense-shell/mobile-only"]
# The octos kernel as a shell service (octosense-kernel, via octosense-ai-host).
octos-core = ["octosense-shell/octos-core"]
app-aichat = ["octosense-shell/app-aichat"]
# Developer mode from Settings and OCTOSENSE_DEV_MODE in a release build
# (debug builds have it already; ADR 0004 §13).
dev-mode = ["octosense-shell/dev-mode"]
# Apps' own WebAssembly functions (ADR 0011): on by default; the service
# runs on macOS, Linux and Android. `wasm-lab` is the feature's former name.
wasm-functions = ["octosense-shell/wasm-functions"]
wasm-lab = ["wasm-functions"]
# The ten ADR 0013 engines behind the system agent and the photo engine:
# a desktop default; on the phone only for tests.
craft-engines = ["octosense-shell/craft-engines"]
# The system toolbox offered to app agents (off by default; ADR 0002 §6).
toolbox-peers = ["octosense-shell/toolbox-peers"]
