# OctoSense Home: the phone package — the shell (crates/shell) plus the
# built-in Settings app, and the Android/OpenHarmony/iOS packaging
# (resources/android, resources/apple, android/, ohos/).
#
# Nested mode (this crate, all desktop OSes): wm owns one OS window,
# fullscreen it and it is the desktop. Tiles host other Makepad apps as
# child processes through the Studio runview mechanism: a tiny in-process
# websocket hub accepts `--stdin-loop` clients, each tile shares a GPU
# swapchain (IOSurface / DXGI handle / DMA-BUF) with its child and forwards
# input over the studio protocol.
#
# Session mode (later, Linux only): the same layout/chrome/protocol with a
# Wayland compositor display backend instead of a Makepad window. The
# layout tree, keybindings, theming and client management are kept free of
# nested-mode assumptions for that reason.

[package]
name = "octosense-home"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
default-run = "octosense-home"

[package.metadata.packager]
product_name = "OctoSense"
identifier = "dev.makepad.octosense"

# Merged over the Info.plist cargo-makepad generates for the iOS bundle:
# the App Transport Security exception News needs (see the file).
[package.metadata.makepad.ios]
info_plist = "resources/apple/Info.plist"

# Android builds this entry point as a shared library. Declaring it explicitly
# avoids cargo-makepad's generated wrapper duplicating our workspace section.
[lib]
path = "src/main.rs"
# The binary target runs the tests for this shared source.
test = false
bench = false
doctest = false

[[bin]]
name = "octosense-home"
path = "src/main.rs"

[dependencies]
# The shell (window manager, hosting, phone layer): everything but Settings,
# which is this package's (src/settings_*.rs, src/android_settings.rs).
octosense-shell = { workspace = true }
# What the Settings app itself uses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
makepad-widgets = { workspace = true, features = ["appcard", "maps"] }
makepad-studio-protocol = { workspace = true }
makepad-wm-api = { workspace = true }
makepad-ai-services = { workspace = true }
makepad-strict-json = { workspace = true }
makepad-app-module = { workspace = true }
octoscript-makepad = { workspace = true }
octosense-ai-host = { workspace = true }
octosense-reference = { workspace = true, optional = true }
octosense-app-hub-app = { workspace = true, optional = true }
makepad-aichat = { workspace = true, optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios", target_env = "ohos"))'.dependencies]
octosense-reference = { workspace = true }
octosense-app-hub-app = { workspace = true }

[features]
# The standalone mobile shell: the Android phone shell fills the window, no
# desk bar, no style switcher, no desktop styles. Android builds get it
# without the flag (build.rs sets the same `mobile_only` cfg for Android and
# OpenHarmony); a desktop build is universal unless this is on.
mobile-only = ["octosense-shell/mobile-only"]
octos-core = ["octosense-shell/octos-core"]
# App Hub is part of the standard launcher, including local desktop runs;
# the octos kernel is a shell service in every standard build. Every feature
# is the shell's (crates/shell/Cargo.toml), forwarded; the default and the
# native apps' features are native-apps.json's. `mobile-apps` is the set
# phone builds link, also usable on a desktop; AppCard is not among them
# (`--features app-appcard`).
# BEGIN native-apps: features (generated by tools/native_apps.py from native-apps.json; do not edit)
default = ["octos-core", "app-rinx", "app-hub"]
mobile-apps = ["app-reference", "app-hub", "octosense-shell/mobile-apps"]
app-rinx = ["octosense-shell/app-rinx"]
app-reference = ["dep:octosense-reference", "octosense-shell/app-reference"]
app-sheets = ["octosense-shell/app-sheets"]
app-appcard = ["octosense-shell/app-appcard"]
app-hub = ["dep:octosense-app-hub-app", "octosense-shell/app-hub"]
# END native-apps: features
app-aichat = ["dep:makepad-aichat", "octosense-shell/app-aichat"]
dev-mode = ["octosense-shell/dev-mode"]
# The system toolbox offered to app agents (off by default; ADR 0002 §6).
toolbox-peers = ["octosense-shell/toolbox-peers"]
