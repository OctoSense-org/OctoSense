# wm — makepad window manager. An Omarchy-behaving tiling window manager
# built as a Makepad app.
#
# Nested mode (this crate, all desktop OSes): wm owns one OS window,
# fullscreen it and it is the desktop. Tiles host other Makepad apps as
# child processes through the Studio runview mechanism: a tiny in-process
# websocket hub accepts `--stdin-loop` clients, each tile shares a GPU
# swapchain (IOSurface / DXGI handle / DMA-BUF) with its child and forwards
# input over the studio protocol.
#
# Session mode (later, Linux only): the same layout/chrome/protocol with a
# Wayland compositor display backend instead of a Makepad window. The
# layout tree, keybindings, theming and client management are kept free of
# nested-mode assumptions for that reason.

[package]
name = "octosense"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
default-run = "octosense"

[package.metadata.packager]
product_name = "OctoSense"
identifier = "dev.makepad.octosense"

# Merged over the Info.plist cargo-makepad generates for the iOS bundle:
# the App Transport Security exception News needs (see the file).
[package.metadata.makepad.ios]
info_plist = "resources/apple/Info.plist"

# Android builds this entry point as a shared library. Declaring it explicitly
# avoids cargo-makepad's generated wrapper duplicating our workspace section.
[lib]
path = "src/main.rs"
# The binary target runs the tests for this shared source.
test = false
bench = false
doctest = false

[[bin]]
name = "octosense"
path = "src/main.rs"

[dependencies]
# The status clock is formatted in-process (localtime_r + strftime), not by forking `date`.
libc = "0.2"
# Data-only observations for the Octoscript Settings controller.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `appcard,maps`: the AppCard widget set (kit, text roles, weather,
# finance, matplot) and the map navigation layer the appcard module renders.
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d0a9def5fc554a52955db21a2a5a196daccc8e3d", features = ["appcard", "maps"] }
makepad-studio-protocol = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d0a9def5fc554a52955db21a2a5a196daccc8e3d" }
makepad-network = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d0a9def5fc554a52955db21a2a5a196daccc8e3d" }
makepad-wm-api = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d0a9def5fc554a52955db21a2a5a196daccc8e3d" }
# The AI services wire only: the WM relays frames between the aichat child and the apps.
makepad-ai-services = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d0a9def5fc554a52955db21a2a5a196daccc8e3d" }
makepad-strict-json = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d0a9def5fc554a52955db21a2a5a196daccc8e3d" }
# In-process hosting (aicontrol §3): the module contract, the palette applied
# into each instance's isolate, and the modules this build links.
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d0a9def5fc554a52955db21a2a5a196daccc8e3d" }
makepad-wm-theme = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d0a9def5fc554a52955db21a2a5a196daccc8e3d" }
makepad-sheets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d0a9def5fc554a52955db21a2a5a196daccc8e3d", default-features = false, optional = true }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "99c1e5ee7925060ced59c66d6f8763c22217e4ad" }
octosense-photos = { path = "apps/photos", optional = true }
octosense-reference = { path = "apps/reference", optional = true }
octosense-mail-service = { path = "../.sources/system-apps/apps/mail/host-service", optional = true }
# `llm` keeps the assistant's LLM providers for the AI providers app
# (`os.ai-providers`); the config crate names the kernel's octos home.
octosense-llm-service = { path = "../.sources/system-apps/apps/ai-providers/host-service", optional = true }
octosense-llm-config = { path = "../.sources/system-apps/apps/ai-providers/config", optional = true }
# The octos agent kernel as a shell service (OctoSense-System-Apps
# crates/octos-core): one kernel per process, started when a consumer (AppCard,
# Rinx) connects, configured by the AI providers app, restarted when the
# providers change. Feature `octos-core`, on by default.
octosense-octos-core = { path = "../.sources/system-apps/crates/octos-core", optional = true }
# The whole AppCard assistant (OctoSense-System-Apps apps/appcard) hosted in
# a tile, in-process (Phase B of the AppCard port): octos-app's AppShell — routing brain, cards, kernel agent.
# Not shipped for now: strictly opt-in with `--features app-appcard`, on
# every target (it is in neither `default`, `mobile-apps`, nor the native
# mobile dependencies below).
octosense-appcard = { path = "apps/appcard", optional = true }
# News: headlines from Hacker News, TechMeme, Google News and the person's
# own feeds, in a tab per source; a wide home tile on the phone.
octosense-news = { path = "apps/news", optional = true }
# App Hub's shell integration (store, Card runner, system apps, icons),
# shared with every OctoSense shell; its build packs the system apps named by
# OCTOSENSE_SYSTEM_APPS (.cargo/config.toml -> system-apps.json).
# Same rev as the Mail and llm host services' octosense-appstore (OctoSense-System-Apps):
# one App Hub source, so one host-service registry.
octosense-app-hub-app = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub", rev = "46d67e51b62827a1224b1aacddc2a7b9e69185fc", optional = true }
# OctosMap: a map under a search bar, places, directions by car, on foot and
# by bike, and turn-by-turn navigation.
octosense-maps = { path = "apps/maps", optional = true }
# The assistant as a module, seated in the pane in-process: the web build's
# only chat, a desktop option. Without the engine feature: no model runtime,
# NoModel and the tool console (the child process keeps the real models).
makepad-aichat = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d0a9def5fc554a52955db21a2a5a196daccc8e3d", default-features = false, optional = true }

# A phone cannot spawn the desktop catalog's Cargo binaries. Link the
# available modules into native mobile builds without requiring CLI flags.
[target.'cfg(any(target_os = "android", target_os = "ios", target_env = "ohos"))'.dependencies]
octosense-reference = { path = "apps/reference" }
octosense-app-hub-app = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub", rev = "46d67e51b62827a1224b1aacddc2a7b9e69185fc" }
# Mail, News, Photos, Maps and Camera ship as contained script apps
# (OctoSense-System-Apps apps/<name>/bundle/, chosen by system-apps.json,
# ADR 0004); the `mail` host service keeps Mail's accounts and passwords.
# `app-news`, `app-photos` and `app-maps` link the native modules instead,
# for comparison; Mail and Camera have no native module any more.
octosense-mail-service = { path = "../.sources/system-apps/apps/mail/host-service" }
# `llm`: the AI providers app's providers, camera QR and image import; it
# restarts the octos kernel (the shell's, below) after a change.
octosense-llm-service = { path = "../.sources/system-apps/apps/ai-providers/host-service", features = ["octos-core"] }
octosense-llm-config = { path = "../.sources/system-apps/apps/ai-providers/config" }
# The octos kernel service: native mobile builds always carry it (Android
# bundles liboctos.so, OpenHarmony links the core in-process).
octosense-octos-core = { path = "../.sources/system-apps/crates/octos-core" }
makepad-sheets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d0a9def5fc554a52955db21a2a5a196daccc8e3d", default-features = false }

[features]
# App Hub is part of the standard launcher, including local desktop runs;
# the octos kernel is a shell service in every standard build.
default = ["app-hub", "octos-core"]
# The standalone mobile shell: the Android phone shell fills the window, no
# desk bar, no style switcher, no desktop styles. Android builds get it
# without the flag (build.rs turns the same `mobile_only` cfg on for
# `target_os = "android"`); a desktop build is universal unless this is on.
mobile-only = []
# Also usable on desktop for testing the same embedded apps with --module.
# AppCard is not among them: it ships only with `--features app-appcard`.
mobile-apps = ["app-reference", "app-sheets", "app-photos", "app-news", "app-maps", "app-hub", "octos-core"]
# The octos kernel as a shell service (octosense-octos-core): Home configures
# it at startup, the `llm` service writes its profile and restarts it, AppCard
# and other consumers connect to it. Opt out with `--no-default-features`
# plus the features you still want; native mobile builds always link it.
octos-core = ["dep:octosense-octos-core", "octosense-llm-service?/octos-core"]
app-hub = ["dep:octosense-app-hub-app", "dep:octosense-mail-service", "dep:octosense-llm-service", "dep:octosense-llm-config"]
app-reference = ["dep:octosense-reference"]
# Sheets linked in as a module (hosting is still Process unless switched).
app-sheets = ["dep:makepad-sheets"]
# The native Photos library, albums, and Memories app. Without it, Photos is
# the system script app (`os.photos`, ADR 0004).
app-photos = ["dep:octosense-photos"]
# The AppCard module (the assistant in a tile) linked in; it connects to the
# shell's octos kernel, so it implies `octos-core`. Opt-in only, on desktop
# and native mobile alike: AppCard is not shipped by default for now (it
# interfered with the other apps).
app-appcard = ["dep:octosense-appcard", "octos-core"]
# The native News module (headlines in a tile) linked in. Without it, News
# is the system script app App Hub ships (`os.news`, ADR 0004).
app-news = ["dep:octosense-news"]
# The native OctosMap module (maps, places, directions, navigation) linked
# in. Without it, Maps is the system script app (`os.maps`, ADR 0004).
app-maps = ["dep:octosense-maps"]
# The aichat module linked in (the pane seats it in-process where there are
# no processes, or when `aichat` is switched to module hosting).
app-aichat = ["dep:makepad-aichat"]

[workspace]
members = [".", "apps/reference", "apps/appcard", "apps/news", "apps/photos", "apps/maps"]
default-members = ["."]
resolver = "2"

[profile.dev]
opt-level = 1

# `octos-app` (the AppCard module's engine) links two inline-renderer kits
# that name makepad-widgets by the ZhangHanDong/makepad URL. Redirected to the
# one makepad lineage this workspace pins, so the graph has a single
# makepad-widgets (a second one would make every widget type mismatch).

[profile.release]
# cargo-makepad builds Android with `-C prefer-dynamic` (libstd as a bundled
# .so): fat LTO refuses that ("cannot prefer dynamic linking when performing
# LTO"), and `panic = "abort"` breaks the cdylib link against the prebuilt
# aarch64-linux-android std, which ships the unwind runtime. Same profile as
# the AppCard app's Cargo.toml documents.
lto = false
panic = "unwind"

# One makepad source. Every makepad crate the graph pulls — Home's, octos-app's
# and App Hub's shell crate's (which names its own makepad rev, including
# makepad-wm-theme) — resolves to the one pinned checkout below.

# Resolve the exact framework sources prepared by tools/setup-native.py.

[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-script = { path = "../.sources/makepad/platform/script" }
makepad-widgets = { path = "../.sources/makepad/widgets" }
makepad-code-editor = { path = "../.sources/makepad/code_editor" }
makepad-ai = { path = "../.sources/makepad/libs/makepad_ai" }
makepad-studio-protocol = { path = "../.sources/makepad/platform/studio" }
makepad-network = { path = "../.sources/makepad/platform/network" }
makepad-wm-api = { path = "../.sources/makepad/libs/wm_api" }
makepad-ai-services = { path = "../.sources/makepad/libs/ai/services" }
makepad-strict-json = { path = "../.sources/makepad/libs/strict_json" }
makepad-app-module = { path = "../.sources/makepad/libs/app_module" }
makepad-wm-theme = { path = "../.sources/makepad/libs/wm_theme" }
makepad-map-nav = { path = "../.sources/makepad/libs/map_nav" }
makepad-sheets = { path = "../.sources/makepad/apps/sheets" }
makepad-aichat = { path = "../.sources/makepad/apps/aichat" }

[patch."https://github.com/OctoSense-org/Octoscript.git"]
octoscript-ui-l0 = { path = "../.sources/octoscript/crates/octoscript-ui-l0" }

[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-makepad = { path = "../.sources/octoscript-makepad/crates/octoscript-makepad" }
octoscript-widgets = { path = "../.sources/octoscript-makepad/crates/octoscript-widgets" }
octoscript-node = { path = "../.sources/octoscript-makepad/crates/octoscript-node" }

[patch."https://github.com/ZhangHanDong/makepad.git"]
makepad-widgets = { path = "../.sources/makepad/widgets" }

# OpenHarmony's ioctl ABI differs from Linux; this is the reviewed native-mobile
# fix from mobile PR #10, vendored by octos. octos-app's own [patch] does not
# reach this workspace, so Home repeats it: the same nix octos-app patches in
# (OctoSense-System-Apps apps/appcard/app/Cargo.toml). octos main, which
# octos-app now takes octos-core/octos-cli from, no longer vendors nix, so it
# still comes from the vendor/ tree of the former branch rev 18fcd3f1. It is
# not an octos crate: `cargo tree -i octos-core` still sees one octos source.
[patch.crates-io]
nix = { git = "https://github.com/octos-org/octos.git", rev = "18fcd3f16e527d2b601d7ae244f056fb711bb6b8" }
