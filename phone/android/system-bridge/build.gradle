plugins { id 'com.android.application' }
def requestedVersionCode = providers.gradleProperty('octosenseVersionCode').getOrElse('1')
def requestedVersionName = providers.gradleProperty('octosenseVersionName').getOrElse('1.0.0')
if (!(requestedVersionCode ==~ /[0-9]+/) || requestedVersionCode.toBigInteger() <= 0 || requestedVersionCode.toBigInteger() >= 2100000000) {
    throw new GradleException('octosenseVersionCode must be a positive Android version code below 2100000000.')
}
if (!(requestedVersionName ==~ /[A-Za-z0-9][A-Za-z0-9.+_-]{0,63}/)) {
    throw new GradleException('octosenseVersionName must be a plain release version (1-64 characters).')
}
def managedKeystore = System.getenv('OCTOSENSE_KEYSTORE')
def signingValue = { String name ->
    def value = System.getenv(name)
    if (!value) throw new GradleException("Set ${name} when using OCTOSENSE_KEYSTORE.")
    value
}
android {
    namespace 'dev.makepad.octosense.bridge'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'dev.makepad.octosense.bridge'
        // Match standard Home and its bundled API33 kernel.
        minSdk 33
        targetSdk 35
        versionCode requestedVersionCode.toInteger()
        versionName requestedVersionName
    }
    signingConfigs {
        octosense {
            storeFile rootProject.file(managedKeystore ?: '../../.sources/makepad/tools/cargo_makepad/debug.keystore')
            storePassword managedKeystore ? signingValue('OCTOSENSE_KEYSTORE_PASSWORD') : 'android'
            keyAlias managedKeystore ? signingValue('OCTOSENSE_KEY_ALIAS') : 'androiddebugkey'
            keyPassword managedKeystore ? (System.getenv('OCTOSENSE_KEY_PASSWORD') ?: storePassword) : 'android'
        }
    }
    buildTypes {
        release {
            if (managedKeystore) signingConfig signingConfigs.octosense
            minifyEnabled false
        }
        prototype {
            initWith release
            signingConfig signingConfigs.octosense
            versionNameSuffix '-prototype'
            matchingFallbacks = ['release']
        }
        validation {
            initWith prototype
            versionNameSuffix '-validation'
            matchingFallbacks = ['release']
        }
    }
    buildFeatures { aidl true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation project(':contracts')
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'
    implementation 'com.github.topjohnwu.libsu:service:6.0.0'
}
