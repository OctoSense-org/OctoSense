plugins { id 'com.android.application' }
android {
    namespace 'com.android.systemui.res'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'dev.makepad.octosense.systemuipreview'
        minSdk 35
        targetSdk 35
        versionCode 1
        versionName '1.0-validation'
    }
    signingConfigs {
        fixture {
            storeFile rootProject.file('../../makepad/tools/cargo_makepad/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixture }
    }
    sourceSets {
        main {
            java.srcDirs = ['../platform-build/systemui/files/src']
            java.includes = ['**/OctoSenseSystemActivity.java']
            res.srcDirs = ['../platform-build/systemui/files/res']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
