name: Home and product build checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/stage-forks.sh scripts/publish-release.sh scripts/apply-to-tree.sh scripts/build-rom.sh
  home:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned sources and policy patch
        run: python3 scripts/setup-home.py
      - name: Compile Home and its bundled modules
        working-directory: home
        run: cargo check --locked --workspace --features mobile-apps
      - name: Verify the single runtime graph
        run: python3 scripts/setup-home.py --check --cargo
      - name: Test Home, App Hub admission and runtime policy
        working-directory: home
        run: |
          cargo test --locked --features mobile-apps -p octosense -p octosense-app-policy -p octosense-app-hub -p octosense-app-hub-app -p octosense-maps -p octosense-news -p octosense-appcard
          cargo test --locked -p makepad-widgets splash_policy
          cargo test --locked -p makepad-script-std gate::tests
