name: Home and product build checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Check generated Agent Binder client
        run: python3 scripts/generate-agent-aidl.py --check --sdk "$ANDROID_HOME"
      - run: bash -n scripts/stage-forks.sh scripts/publish-release.sh scripts/apply-to-tree.sh scripts/build-rom.sh
  home:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned sources and policy patch
        run: python3 scripts/setup-home.py
      - name: Compile Home and its bundled modules
        working-directory: home
        run: |
          # The octos kernel is a shell service (feature `octos-core`): the
          # default and mobile-apps builds link it, on desktop and Android.
          cargo check --locked
          cargo check --locked --features mobile-apps
          for features in "" "--features mobile-apps"; do
            for target in "" "--target aarch64-linux-android"; do
              cargo tree --locked $features $target -i octosense-octos-core --depth 0 >/dev/null || { echo "::error::octosense-octos-core is missing ($features $target)"; exit 1; }
            done
          done
          # AppCard's UI (the octosense-appcard module) stays opt-in: the
          # default and mobile-apps builds must not link it, and the opt-in
          # must still build.
          for target in "" "--target aarch64-linux-android"; do
            out=$(cargo tree --locked --features mobile-apps $target -i octosense-appcard 2>&1 || true)
            grep -q "did not match any packages" <<<"$out" || { echo "::error::octosense-appcard is linked without app-appcard ($target)"; echo "$out"; exit 1; }
          done
          cargo check --locked --workspace --features mobile-apps,app-appcard
          # Hosted Rinx (app-rinx, in default and mobile-apps) is the library
          # module only: never its standalone entry or its own local kernel
          # (Rinx ADR 0007). Its assistant is the shell's app-peers service.
          for features in "" "--features mobile-apps"; do
            for target in "" "--target aarch64-linux-android"; do
              tree=$(cargo tree --locked $features $target -e features -i rinx)
              grep -q 'rinx feature "octosense-module"' <<<"$tree" || { echo "::error::rinx is not linked as a module ($features $target)"; exit 1; }
              if grep -qE 'rinx feature "(standalone|octos-local|octos-remote)"' <<<"$tree"; then
                echo "::error::hosted rinx pulls a standalone runtime ($features $target)"; exit 1
              fi
              cargo tree --locked $features $target -i octosense-app-peers --depth 0 >/dev/null || { echo "::error::octosense-app-peers is missing ($features $target)"; exit 1; }
            done
          done
      - name: Verify the single runtime graph
        run: python3 scripts/setup-home.py --check --cargo
      - name: Test Home, App Hub admission and runtime policy
        working-directory: home
        run: |
          # octosense-app-hub-app is App Hub's shared shell crate, a git
          # dependency with dev-dependencies: cargo cannot test it from here;
          # OctoSense-App-Hub's CI tests it.
          cargo test --locked --features mobile-apps -p octosense -p octosense-app-policy -p octosense-app-hub -p octosense-news -p octosense-appcard
          # The opt-in AppCard build: its module registers into Home.
          cargo test --locked --features mobile-apps,app-appcard -p octosense appcard
          # Maps' isolate tests need init_cx_os(), whose macOS game-input setup
          # traps off the main thread, where libtest runs tests (RUNTIME-01).
          cargo test --locked -p octosense-maps -- --skip view::tests --skip module::tests
          cargo test --locked -p makepad-widgets splash_policy
          cargo test --locked -p makepad-script-std gate::tests
