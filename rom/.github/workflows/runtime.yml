name: Shared runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          path: workspace/OctoSense-mobile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Octoscript-Makepad
        working-directory: workspace/OctoSense-mobile
        run: python tools/setup-native.py
      # The hosted Mail module is the AppCards repository's native crate, a
      # sibling path dependency like the framework checkouts.
      - name: Prepare the AppCards sibling
        run: |
          git clone --quiet --no-checkout https://github.com/OctoSense-org/Octoscript-AppCard.git workspace/Octosense-Service-AppCards
          git -C workspace/Octosense-Service-AppCards fetch --quiet --depth=1 origin 2c070cbcc5d92bd0234f6eaa17564f2579e68c44
          git -C workspace/Octosense-Service-AppCards checkout --quiet --detach 2c070cbcc5d92bd0234f6eaa17564f2579e68c44
      - name: Compile with the shared runtime
        working-directory: workspace/OctoSense-mobile
        run: |
          cargo check --locked --workspace --features mobile-apps
      - name: Reject divergent runtime sources
        working-directory: workspace/OctoSense-mobile
        run: |
          python tools/setup-native.py --check --cargo-manifest Cargo.toml
